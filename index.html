<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkMatter Pro AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <style>
        :root {
            --bg-color: #14081f;
            --panel-color: #1e1030;
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.6);
            --text-primary: #f8fafc;
            --text-secondary: #c4b5fd;
            --user-bubble: linear-gradient(135deg, #9333ea, #6b21a8);
            --ai-bubble: linear-gradient(135deg, #2e1065, #1e1030);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 16, 48, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            z-index: 100;
            flex-shrink: 0;
            position: relative;
            animation: slideDown 0.5s ease-out forwards;
        }

        .title-small {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .status { font-size: 0.6rem; color: #c084fc; text-transform: uppercase; letter-spacing: 1px; animation: blink 2s ease-in-out infinite; }

        .menu-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.25);
            background: rgba(20, 8, 31, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            margin-right: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .menu-btn span {
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: white;
            transition: all 0.3s ease;
        }

        .menu-btn:active span:nth-child(1) {
            transform: rotate(-45deg) translateY(10px);
        }

        .menu-btn:active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn:active span:nth-child(3) {
            transform: rotate(45deg) translateY(-10px);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        #sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }

        #sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: #1a0c2a;
            z-index: 1000;
            border-right: 1px solid rgba(168, 85, 247, 0.25);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #sidebar.active {
            left: 0;
            animation: slideInLeft 0.3s ease-out forwards;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .sidebar-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
        }

        .new-chat-btn {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: #a855f7;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .new-chat-btn:active {
            transform: scale(0.95);
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-item {
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
            animation: slideInLeft 0.4s ease-out forwards;
        }

        .chat-item:hover {
            background: rgba(168, 85, 247, 0.16);
            transform: translateX(5px);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .chat-item.active {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            animation: glow 1.5s ease-in-out infinite;
        }

        .chat-item-title {
            font-size: 0.82rem;
            color: white;
            font-weight: bold;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item-preview {
            font-size: 0.7rem;
            color: #d8b4fe;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #chat-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 10px var(--accent-glow); }
            50% { text-shadow: 0 0 20px var(--accent-glow), 0 0 30px rgba(168, 85, 247, 0.8); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 12px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .msg-wrapper { max-width: 90%; display: flex; animation: slideUp 0.4s ease-out forwards; flex-direction: column; }
        .user-wrapper { align-self: flex-end; }
        .ai-wrapper { align-self: flex-start; }

        .bubble {
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 0.9rem;
            line-height: 1.5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }

        .bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.35);
        }

        .user-bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; animation: slideUp 0.5s ease-out forwards; }
        .ai-bubble { background: var(--ai-bubble); border: 1px solid rgba(168, 85, 247, 0.15); border-bottom-left-radius: 4px; animation: slideUp 0.5s ease-out forwards; }

        .katex {
            color: #f0e6ff;
            font-size: 1em;
        }

        .katex-display {
            margin: 10px 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .katex-display > .katex {
            font-size: 1.1em;
        }

        .code-block-wrapper {
            margin: 12px 0;
            border-radius: 12px;
            overflow: hidden;
            border-left: 3px solid var(--accent-color);
            background: #12061d;
            animation: slideUp 0.5s ease-out forwards;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .code-block-wrapper:hover {
            border-left-color: #d8b4fe;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1e1030;
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            animation: fadeIn 0.4s ease-out forwards;
            width: 100%;
            flex-shrink: 0;
            order: -1;
        }

        .code-language {
            color: var(--accent-color);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(168, 85, 247, 0.12);
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid rgba(168, 85, 247, 0.22);
            animation: fadeIn 0.5s ease-out forwards;
        }

        .copy-indicator {
            color: #d8b4fe;
            font-size: 0.7rem;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .code-copy-btn {
            background: rgba(168, 85, 247, 0.1);
            color: #c4b5fd;
            border: 1px solid rgba(168, 85, 247, 0.28);
            padding: 4px 13px;
            border-radius: 6px;
            font-size: 0.67rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.4px;
            white-space: nowrap;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .code-copy-btn:hover {
            background: rgba(168, 85, 247, 0.28);
            color: white;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
        }

        .code-copy-btn:active {
            transform: scale(0.94);
        }

        pre {
            background: #12061d;
            margin: 0;
            padding: 15px;
            border-radius: 0;
            font-family: monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            color: #e9d5ff;
            -webkit-user-select: text;
            user-select: text;
            animation: fadeIn 0.6s ease-out forwards;
            flex: 1;
        }

        pre code {
            display: block;
            min-width: max-content;
            white-space: pre;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 999;
            background: rgba(168, 85, 247, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 10px;
            font-size: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transform: translateX(0px);
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 12px;
            margin-bottom: 8px;
            color: #ffffff;
            animation: slideUp 0.5s ease-out forwards;
        }

        h1 {
            font-size: 1.5rem;
        }

        h2 {
            font-size: 1.3rem;
        }

        h3 {
            font-size: 1.1rem;
        }

        strong {
            color: #ffffff;
            font-weight: bold;
        }

        ul, ol {
            padding-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
            animation: slideUp 0.5s ease-out forwards;
        }

        li {
            margin-bottom: 6px;
            animation: slideUp 0.5s ease-out forwards;
        }

        .chat-img {
            max-width: 200px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.4s ease-out forwards;
            transition: all 0.3s ease;
        }

        .chat-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        #preview-container {
            display: none;
            padding: 10px 20px;
            background: var(--panel-color);
            border-top: 1px solid rgba(168, 85, 247, 0.25);
            position: relative;
            animation: slideUp 0.3s ease-out forwards;
        }

        #img-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
            animation: slideUp 0.3s ease-out forwards;
            transition: all 0.3s ease;
        }

        #img-preview:hover {
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        .close-preview {
            position: absolute;
            top: 5px;
            left: 75px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-preview:hover {
            background: #dc2626;
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .input-area-wrapper {
            background: var(--panel-color);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            padding: 10px 14px;
            padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 10px);
            display: flex;
            flex-direction: column;
            gap: 0px;
            flex-shrink: 0;
            position: relative;
            animation: slideUp 0.5s ease-out forwards;
        }

        .image-cooldown-text {
            display: none;
        }

        .mode-selector {
            display: flex;
            gap: 6px;
            padding: 6px 0px 8px 0px;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            width: 100%;
        }

        .mode-selector::-webkit-scrollbar {
            display: none;
        }

        .mode-btn {
            background: rgba(168, 85, 247, 0.06);
            border: 1px solid rgba(168, 85, 247, 0.18);
            color: rgba(196, 181, 253, 0.6);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.69rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .mode-btn:hover:not(:disabled) {
            background: rgba(168, 85, 247, 0.16);
            border-color: rgba(168, 85, 247, 0.42);
            color: white;
        }

        .mode-btn.active {
            background: rgba(168, 85, 247, 0.22);
            border-color: #a855f7;
            color: white;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.25);
        }

        .mode-btn.mode-locked {
            opacity: 0.42;
            cursor: not-allowed;
        }

        .mode-lock-icon {
            width: 10px;
            height: 10px;
            opacity: 0.75;
            flex-shrink: 0;
        }

        .mode-premium-tag {
            font-size: 0.56rem;
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.35);
            padding: 1px 5px;
            border-radius: 6px;
            background: rgba(245, 158, 11, 0.08);
            letter-spacing: 0.3px;
            white-space: nowrap;
            text-transform: none;
        }

        .input-area {
            padding: 0;
            background: transparent;
            border-top: none;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            padding-bottom: 0;
            align-items: center;
            justify-content: center;
        }

        .attach-btn-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cooldown-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.52rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(168, 85, 247, 0.9);
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: 50%;
            background: rgba(20, 8, 31, 0.72);
            z-index: 2;
        }

        .cooldown-badge.visible {
            opacity: 1;
        }

        .field {
            flex: 1;
            background: #14081f;
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 25px;
            padding: 12px 18px;
            color: white;
            outline: none;
            font-size: 16px;
            resize: none;
            min-height: 48px;
            height: 48px;
            max-height: 140px;
            overflow-y: auto;
            line-height: 1.5;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease-out forwards;
        }

        .field:focus { border-color: var(--accent-color); box-shadow: 0 0 15px var(--accent-glow); }

        .field:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            min-height: 48px;
            background: #7c3aed;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
            flex-shrink: 0;
            transition: 0.2s;
            align-self: center;
            animation: slideUp 0.5s ease-out forwards;
        }

        .btn-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.7);
        }

        .btn-icon:active {
            transform: scale(0.95);
        }

        .btn-icon.active {
            background: #a855f7;
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.8);
        }

        .btn-icon.active:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 1);
        }

        .btn-icon:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
            background: #2a1045;
            transform: none;
            filter: brightness(0.5);
        }

        .attach-btn {
            background: #6d28d9;
            box-shadow: 0 0 10px rgba(109, 40, 217, 0.35);
            position: relative;
            overflow: hidden;
        }

        .attach-btn:hover {
            background: #7c3aed;
            box-shadow: 0 0 18px rgba(109, 40, 217, 0.6);
        }

        .attach-btn:disabled {
            background: #1e0a30;
            box-shadow: none;
            opacity: 0.35;
            filter: brightness(0.4);
        }

        .dots { display: flex; gap: 4px; padding: 10px; animation: fadeIn 0.3s ease-out forwards; }
        .dot { width: 5px; height: 5px; background: var(--accent-color); border-radius: 50%; animation: pulse 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; transform: scale(1.2); } }

        .ai-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            padding-left: 4px;
            align-items: center;
        }

        .ai-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(196, 181, 253, 0.5);
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease;
            line-height: 1;
        }

        .ai-action-btn:hover {
            color: rgba(196, 181, 253, 1);
            transform: scale(1.2);
        }

        .ai-action-btn:active {
            transform: scale(0.9);
        }

        .ai-action-btn svg {
            width: 14px;
            height: 14px;
        }

        .user-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            padding-right: 4px;
            align-items: center;
            justify-content: flex-end;
        }

        .user-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(196, 181, 253, 0.4);
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease;
            line-height: 1;
        }

        .user-action-btn:hover {
            color: rgba(196, 181, 253, 0.9);
            transform: scale(1.2);
        }

        .user-action-btn:active {
            transform: scale(0.9);
        }

        .user-action-btn svg {
            width: 14px;
            height: 14px;
        }

        .stop-btn-icon {
            background: #7c3aed;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
        }

        .stop-btn-icon:hover {
            background: #ef4444;
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.7);
            transform: scale(1.1);
        }

        .edit-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9000;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s ease-out forwards;
        }

        .edit-modal {
            background: #1a0c2a;
            border: 1px solid rgba(168, 85, 247, 0.35);

La NRS-10 es el reglamento técnico colombiano que establece los criterios y requisitos mínimos para el diseño, construcción y supervisión técnica de edificaciones nuevas, así como para la evaluación y reforzamiento de construcciones existentes, con el objetivo de que sean resistentes a los sismos. Fue adoptada mediante el Decreto 926 de 2010 y actualizada por los Decretos 2525 de 2010, 092 de 2011 y 340 de 2012.

ESTRUCTURA DE LA NRS-10:
La norma está organizada en títulos que cubren diferentes aspectos del diseño sismo resistente:
- Título A: Requisitos Generales de Diseño y Construcción Sismo Resistente.
- Título B: Cargas.
- Título C: Concreto Estructural.
- Título D: Mampostería Estructural.
- Título E: Casas de Uno y Dos Pisos.
- Título F: Estructuras Metálicas.
- Título G: Madera.
- Título H: Estudios Geotécnicos.
- Título I: Supervisión Técnica.
- Título J: Requisitos de Protección contra el Fuego.
- Título K: Requisitos Complementarios.

CONCEPTOS CLAVE Y FÓRMULAS PRINCIPALES:

1. AMENAZA SÍSMICA Y ZONAS:
Colombia está dividida en zonas de amenaza sísmica: Alta, Intermedia y Baja. El parámetro fundamental es la aceleración pico efectiva Aa y la velocidad pico efectiva Av. La aceleración espectral de diseño se determina mediante los espectros de diseño.

2. ESPECTRO DE DISEÑO (Título A, NSR-10):
El espectro de aceleraciones de diseño Sa se construye con los parámetros Fa, Fv, Aa y Av:
$$S_{aD} = \frac{2.5 \cdot F_a \cdot A_a \cdot T_0}{T} \quad \text{para } T < T_0$$
$$S_{aD} = 2.5 \cdot F_a \cdot A_a \quad \text{para } T_0 \leq T \leq T_c$$
$$S_{aD} = \frac{1.2 \cdot F_v \cdot A_v}{T} \quad \text{para } T > T_c$$
Donde:
- $T$ = período fundamental de vibración de la estructura [s]
- $T_0 = 0.1 \cdot \frac{F_v \cdot A_v}{F_a \cdot A_a}$
- $T_c = 0.48 \cdot \frac{F_v \cdot A_v}{F_a \cdot A_a}$
- $F_a$ = coeficiente de amplificación para períodos cortos (función del perfil de suelo y Aa)
- $F_v$ = coeficiente de amplificación para períodos largos (función del perfil de suelo y Av)
- $A_a$ = aceleración pico efectiva
- $A_v$ = velocidad pico efectiva

3. FUERZA SÍSMICA EN LA BASE (Cortante Basal):
$$V_s = \frac{S_a(T)}{R \cdot \Omega_0 \cdot \phi_E} \cdot W$$
Donde:
- $V_s$ = cortante sísmico en la base [kN]
- $S_a(T)$ = aceleración espectral de diseño para el período T
- $R$ = coeficiente de capacidad de disipación de energía (depende del sistema estructural)
- $\Omega_0$ = factor de sobre-resistencia
- $\phi_E$ = factor de redundancia
- $W$ = peso sísmico de la edificación [kN]

El cortante basal mínimo es:
$$V_{s,min} = \frac{0.044 \cdot S_{DS} \cdot I_E}{R / \Omega_0} \cdot W$$

4. DISTRIBUCIÓN VERTICAL DE FUERZAS SÍSMICAS:
La fuerza lateral en el nivel x se calcula como:
$$F_x = C_{vx} \cdot V_s$$
$$C_{vx} = \frac{w_x \cdot h_x^k}{\sum_{i=1}^{n} w_i \cdot h_i^k}$$
Donde:
- $w_x$, $w_i$ = peso sísmico del nivel x o i [kN]
- $h_x$, $h_i$ = altura del nivel x o i medida desde la base [m]
- $k$ = exponente relacionado con el período: $k=1$ si $T \leq 0.5$ s; $k=2$ si $T \geq 2.5$ s; interpolación lineal para valores intermedios

5. PERÍODO FUNDAMENTAL DE VIBRACIÓN (método aproximado):
$$T_a = C_t \cdot h_n^x$$
Donde:
- $h_n$ = altura total de la edificación [m]
- $C_t$ y $x$ dependen del sistema estructural:
  - Pórticos de concreto resistentes a momentos: $C_t = 0.047$, $x = 0.9$
  - Pórticos de acero resistentes a momentos: $C_t = 0.072$, $x = 0.8$
  - Otros sistemas: $C_t = 0.049$, $x = 0.75$

6. DERIVAS DE PISO (Desplazamientos laterales):
La deriva de piso $\Delta$ no debe exceder los límites establecidos. La deriva inelástica se calcula como:
$$\Delta_i = C_d \cdot \delta_{xe}$$
Donde:
- $C_d$ = factor de amplificación de la deflexión
- $\delta_{xe}$ = desplazamiento elástico obtenido del análisis
La deriva relativa entre pisos no debe superar:
$$\frac{\Delta_i}{h_{sx}} \leq \Delta_a$$
Donde $h_{sx}$ es la altura del entrepiso y $\Delta_a$ es la deriva admisible (típicamente 0.01 a 0.02 según el grupo de uso).

7. PERFILES DE SUELO:
La NRS-10 clasifica los perfiles de suelo en tipos A, B, C, D, E y F según la velocidad de onda de corte $\bar{V}_s$, el número de golpes SPT $\bar{N}$ y la resistencia al corte no drenado $\bar{S}_u$:
$$\bar{V}_s = \frac{\sum_{i=1}^{n} d_i}{\sum_{i=1}^{n} \frac{d_i}{V_{si}}}$$
Donde $d_i$ es el espesor de cada capa y $V_{si}$ su velocidad de onda de corte.

8. GRUPOS DE USO E IMPORTANCIA:
- Grupo I (Uso Normal): $I_E = 1.00$
- Grupo II (Uso Especial): $I_E = 1.10$
- Grupo III (Atención a la Comunidad): $I_E = 1.25$
- Grupo IV (Instalaciones Indispensables): $I_E = 1.50$

El coeficiente de importancia $I_E$ afecta directamente el cortante basal.

9. DISEÑO DE ELEMENTOS DE CONCRETO (Título C):
Resistencia a la flexión de vigas:
$$M_n = A_s \cdot f_y \cdot \left(d - \frac{a}{2}\right)$$
$$a = \frac{A_s \cdot f_y}{0.85 \cdot f'_c \cdot b}$$
Donde:
- $M_n$ = momento nominal resistente [kN·m]
- $A_s$ = área de acero de refuerzo en tensión [mm²]
- $f_y$ = resistencia a la fluencia del acero [MPa]
- $d$ = peralte efectivo de la sección [mm]
- $a$ = profundidad del bloque de compresión equivalente [mm]
- $f'_c$ = resistencia a la compresión del concreto [MPa]
- $b$ = ancho de la sección [mm]

Resistencia al corte:
$$V_n = V_c + V_s$$
$$V_c = 0.17 \cdot \lambda \cdot \sqrt{f'_c} \cdot b_w \cdot d$$
$$V_s = \frac{A_v \cdot f_{yt} \cdot d}{s}$$
Donde:
- $V_c$ = resistencia al corte del concreto [kN]
- $V_s$ = resistencia al corte del acero transversal [kN]
- $\lambda$ = factor de modificación del concreto liviano (1.0 para concreto normal)
- $b_w$ = ancho del alma [mm]
- $A_v$ = área de los estribos [mm²]
- $f_{yt}$ = resistencia a la fluencia del acero transversal [MPa]
- $s$ = espaciamiento de estribos [mm]

10. MAMPOSTERÍA ESTRUCTURAL (Título D):
Resistencia a compresión de la mampostería:
$$f'_m = \frac{P_{max}}{A_{neta}}$$
Resistencia al corte de muros de mampostería:
$$V_m = v_m \cdot A_n + 0.45 \cdot N_u$$
Donde $v_m$ es el esfuerzo de corte de la mampostería, $A_n$ es el área neta del muro y $N_u$ es la carga axial de diseño.

11. SISTEMAS ESTRUCTURALES Y COEFICIENTES R:
- Pórtico resistente a momentos de concreto especial (PRCE): $R = 7$
- Pórtico resistente a momentos de acero especial (PRAE): $R = 8$
- Muros estructurales de concreto especiales: $R = 5$
- Mampostería estructural reforzada: $R = 4$
- Dual (muros + pórticos): $R = 7$

CONSIDERACIONES ADICIONALES:
- Irregularidades en planta y en altura reducen el coeficiente R mediante el factor $\phi_a$ (planta) y $\phi_p$ (altura).
- El análisis puede ser estático equivalente, dinámico modal espectral o dinámico paso a paso según la complejidad de la estructura.
- Los estados límite de diseño son: resistencia ($U$), servicio y sismo de diseño.
- Las combinaciones de carga incluyen: $U = 1.2D + 1.0E + 1.0L + 0.2S$ para cargas sísmicas, entre otras.`;

    function getImageCooldownRemaining() {

        if (imageSentTimestamp !== null) {
            const elapsed = Date.now() - imageSentTimestamp;
            const remaining = IMAGE_COOLDOWN_TIME - elapsed;
            if (remaining > 0) {
                return remaining;
            } else {
                imageSentTimestamp = null;
                return 0;
            }
        }

        const savedTime = localStorage.getItem("darkmatter_last_image_time");

        if (!savedTime) {
            return 0;
        }

        const elapsed = Date.now() - parseInt(savedTime);

        const remaining = IMAGE_COOLDOWN_TIME - elapsed;

        if (remaining < 0) {
            return 0;
        }

        return remaining;

    }

    function formatCooldownTime(ms) {
        const totalSeconds = Math.ceil(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }

    async function compressImage(base64, quality = 0.75, maxWidth = 1024) {

        return new Promise((resolve) => {

            const img = new Image();

            img.onload = function() {

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                const canvas = document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(img, 0, 0, width, height);

                const compressed = canvas.toDataURL("image/jpeg", quality);

                resolve(compressed);

            };

            img.src = base64;

        });

    }

    function optimizeConversationHistory() {

        const systemMessage = conversationHistory[0];
        const messageCount = conversationHistory.length - 1;

        let recentMessages = [];

        if (messageCount > 20) {
            recentMessages = conversationHistory.slice(-8);
        } else if (messageCount > 12) {

    function extractRetrySeconds(errorMessage) {

        const regex = /try again in ([0-9.]+)s/i;

        const match = errorMessage.match(regex);

        if (match && match[1]) {
            return Math.ceil(parseFloat(match[1]));
        }

        return 5;

    }

    function wait(ms) {

        return new Promise(resolve => setTimeout(resolve, ms));

    }

    async function sendRequestWithRetry(requestBody, signal) {

        while (true) {

            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody),
                signal: signal
            });

            if (r.ok) {
                return r;
            }

            let errorText = await r.text();

            try {

                const errorJson = JSON.parse(errorText);

                if (errorJson.error && errorJson.error.message) {

                    const errorMessage = errorJson.error.message;

                    if (errorMessage.toLowerCase().includes("rate limit")) {

                        const seconds = extractRetrySeconds(errorMessage);

                        await wait(seconds * 1000);

                        continue;

                    }

                }

            } catch {

            }

            throw new Error(errorText);

        }

    }

        }

        const imageKeywords = [

            "foto",
            "ejercicio",
            "guía",
            "guia",
            "taller",
            "esto",
            "eso",
            "ahí",

            "analiza",
            "resuelve",

        ];

        return imageKeywords.some(keyword => lowerText.includes(keyword));

    }

    function preprocessLatex(text) {

        if (!text) {
            return "";
        }

        let result = text;

        result = result.replace(/\\\[([\s\S]*?)\\\]/g, function(match, inner) {
            return '$$' + inner + '$$';
        });

        result = result.replace(/\\\(([\s\S]*?)\\\)/g, function(match, inner) {
            return '$' + inner + '$';
        });

        result = result.split('\n').map(function(line) {

            if (/\$/.test(line)) {
                return line;
            }

            const hasLatexCommands = /\\(frac|sqrt|cdot|sum|int|left|right|times|div|pm|mp|leq|geq|neq|approx|infty|partial|nabla|alpha|beta|gamma|delta|theta|lambda|mu|pi|sigma|phi|omega|forall|exists|in|notin|subset|supset|cup|cap|wedge|vee|neg|Rightarrow|Leftarrow|Leftrightarrow|rightarrow|leftarrow|uparrow|downarrow|overline|underline|hat|bar|vec|dot|ddot|tilde|mathbf|mathrm|mathit|text|begin|end|pmatrix|bmatrix|vmatrix)\b/.test(line);

            const hasSubSuperScript = /[a-zA-Z0-9]_\{|[a-zA-Z0-9]\^\{/.test(line);

            if (hasLatexCommands || hasSubSuperScript) {
                return '$$' + line + '$$';
            }

            return line;

        }).join('\n');

        return result;

    }

                userMessage = {
                    role: "user",
                    content: [
                        {
                            type: "text",
                            text: `Analiza esta imagen detalladamente. Lee todo el texto visible. Si es un ejercicio o guía, resuelve cada punto con claridad y de forma completa y extensa. Explica procedimientos paso a paso sin omitir nada. Si necesitas explicar muchas cosas, hazlo todas. Escribe TODAS las fórmulas y expresiones matemáticas en formato LaTeX usando $...$ para fórmulas en línea y $$...$$ para fórmulas en bloque. NUNCA escribas fórmulas como texto plano. ${text ? "Pregunta adicional del usuario: " + text : ""}`
                        },
                        {
                            type: "image_url",
                            image_url: {
                                url: tempImage
                            }
                        }
                    ]
                };

            } else {

                if (lastCompressedImageBase64 && isImageRelatedQuestion(text)) {

                    userMessage = {
                        role: "user",
                        content: [
                            {
                                type: "text",
                                text: `Basándote en la imagen anterior: ${text}`
                            },
                            {
                                type: "image_url",
                                image_url: {
                                    url: lastCompressedImageBase64
                                }
                            }
                        ]
                    };

                } else {

                    userMessage = {
                        role: "user",
                        content: text
                    };

                }

            conversationHistory.push(userMessage);

            optimizeConversationHistory();

            updateCurrentChatStorage();

            const modeConfig = MODE_CONFIGS[currentMode] || MODE_CONFIGS.normal;

                max_tokens: modeConfig.max_tokens
            };

            toggleLoad(false);

            const d = await r.json();

            if(d.choices && d.choices[0] && d.choices[0].message) {

            setGeneratingState(false);

            toggleLoad(false);

            const d = await r.json();

            if(d.choices && d.choices[0] && d.choices[0].message) {

                const aiResponse = cleanResponse(d.choices[0].message.content);

                conversationHistory.push({
                    role: "assistant",
                    content: aiResponse
                });

                optimizeConversationHistory();

                updateCurrentChatStorage();

                addMsg(aiResponse, 'ai');
                await addMessageToCurrentChat('ai', aiResponse, null, true);

            } else if (d.error) {

                if (d.error.code === "rate_limit_exceeded") {
                    addMsg("Motor saturado (Rate Limit). Por favor, espera un momento.", 'ai');
                } else {
                    addMsg("Error de la IA: " + d.error.message, 'ai');
                }

            } else {

                addMsg("Respuesta inesperada del servidor.", 'ai');

            }

        } catch(e) {

            toggleLoad(false);

            if (e.name === 'AbortError') {
                addMsg("Generacion detenida.", 'ai');
            } else {
                addMsg("Error de conexion al nucleo: " + e.message, 'ai');
            }

        } finally {

            toggleLoad(false);

            setGeneratingState(false);

            clearGeneratingState();

            input.style.height = "48px";
            input.scrollTop = 0;

            autoResizeTextarea();

        }

    }

    function cleanResponse(text) {

        if (!text) {
            return "";
        }

        let cleaned = text;

        cleaned = cleaned.replace(/```math/g, "```math");
        cleaned = cleaned.replace(/```lua/g, "```lua");
        cleaned = cleaned.replace(/```luau/g, "```luau");
        cleaned = cleaned.replace(/```html/g, "```html");
        cleaned = cleaned.replace(/```css/g, "```css");
        cleaned = cleaned.replace(/```javascript/g, "```javascript");
        cleaned = cleaned.replace(/```js/g, "```js");
        cleaned = cleaned.replace(/```python/g, "```python");

        return cleaned;

    }

    function renderKatexInElement(element) {

        if (typeof renderMathInElement !== 'undefined') {

            renderMathInElement(element, {
                delimiters: [
                    { left: "$$", right: "$$", display: true },
                    { left: "$", right: "$", display: false },
                    { left: "\\(", right: "\\)", display: false },
                    { left: "\\[", right: "\\]", display: true }
                ],
                throwOnError: false,
                errorColor: '#cc0000',
                strict: false,
                trust: false,
                macros: {
                    "\\sqrt": "\\sqrt"
                }
            });

        }

    }

    function parseMarkdown(text) {

        if (!text) {
            return "";
        }

        const latexBlocks = [];

        let processed = preprocessLatex(text);

        processed = processed.replace(/\$\$([\s\S]*?)\$\$/g, function(match, inner) {
            latexBlocks.push({ type: 'display', content: match });
            return '___LATEX_BLOCK_' + (latexBlocks.length - 1) + '___';
        });

        processed = processed.replace(/\$([^\$\n]+?)\$/g, function(match, inner) {
            latexBlocks.push({ type: 'inline', content: match });
            return '___LATEX_INLINE_' + (latexBlocks.length - 1) + '___';
        });

        let parsed = escapeHtml(processed);

        parsed = parsed.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        parsed = parsed.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        parsed = parsed.replace(/^# (.*$)/gim, '<h1>$1</h1>');

        parsed = parsed.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');

        parsed = parsed.replace(/^\* (.*$)/gim, '<li>$1</li>');
        parsed = parsed.replace(/^\- (.*$)/gim, '<li>$1</li>');

        parsed = parsed.replace(/(<li>.*<\/li>)/gims, '<ul>$1</ul>');

        parsed = parsed.replace(/\n/g, '<br>');

        parsed = parsed.replace(/<\/ul><br><ul>/g, '');

        parsed = parsed.replace(/___LATEX_BLOCK_(\d+)___/g, function(match, idx) {
            return latexBlocks[parseInt(idx)].content;
        });

        parsed = parsed.replace(/___LATEX_INLINE_(\d+)___/g, function(match, idx) {
            return latexBlocks[parseInt(idx)].content;
        });

        return parsed;

    }

    function detectLanguage(codeText) {

        const firstLine = codeText.split('\n')[0].trim().toLowerCase();

        const languageList = [
            "html",
            "css",
            "javascript",
            "js",
            "python",
            "lua",
            "luau",
            "java",
            "cpp",
            "csharp",
            "php",
            "json",
            "pseudocode",
            "pseudo",
            "bash",
            "shell",
            "sh",
            "typescript",
            "ts",
            "sql",
            "xml",
            "yaml",
            "yml",
            "rust",
            "go",
            "swift",
            "kotlin",
            "ruby",
            "c",
            "text",
            "plaintext",
            "algorithmia",
            "algorithm",
            "algoritmo"
        ];

        if (languageList.includes(firstLine)) {
            return firstLine;
        }

        if (/^[a-z][a-z0-9_-]*$/.test(firstLine) && firstLine.length >= 2 && firstLine.length <= 25) {
            return firstLine;
        }

        return "código";

    }

    function removeLanguageLine(codeText, language) {

        const lines = codeText.split('\n');

        const firstLineLower = lines[0].trim().toLowerCase();

        if (language !== "código" && firstLineLower === language.toLowerCase()) {
            lines.shift();
        }

        return lines.join('\n');

    }

    function addMsg(t, type, img = null, shouldSave = true) {

        const w = document.createElement('div');

        w.className = `msg-wrapper ${type}-wrapper`;

        if (img) {

            const i = document.createElement('img');

            i.src = img;

            i.className = 'chat-img';

            w.appendChild(i);

        }

        const b = document.createElement('div');

        b.className = `bubble ${type}-bubble`;

        if(t && t.includes('```')) {

            const p = t.split('```');

            b.innerHTML = p.map((c, i) => {

                if (i % 2 === 1) {

                    const detectedLanguage = detectLanguage(c.trim());

                    const cleanCode = removeLanguageLine(c.trim(), detectedLanguage);

                    return `<div class="code-block-wrapper"><div class="code-header"><div class="code-language">${escapeHtml(detectedLanguage)}</div><button class="code-copy-btn" onclick="copyCodeBlock(this)">Copiar</button></div><pre oncontextmenu="copyCode(event, this)"><code>${escapeHtml(cleanCode)}</code></pre></div>`;

                }

                return parseMarkdown(c);

            }).join('');

        } else if (t) {

            b.innerHTML = parseMarkdown(t);

        }

        if (t || img) {

            w.appendChild(b);

            if (type === 'ai') {

                renderKatexInElement(b);

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'ai-actions';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'ai-action-btn';
                copyBtn.title = 'Copiar respuesta';
                copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
                copyBtn.onclick = async () => {
                    await copyAiMessage(t || "");
                    copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                    setTimeout(() => {
                        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
                    }, 2000);
                };

                const regenBtn = document.createElement('button');
                regenBtn.className = 'ai-action-btn';
                regenBtn.title = 'Regenerar respuesta';
                regenBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`;
                regenBtn.onclick = () => {
                    regenerateLastResponse();
                };

                actionsDiv.appendChild(copyBtn);
                actionsDiv.appendChild(regenBtn);
                w.appendChild(actionsDiv);

            }

            if (type === 'user') {

                const userActionsDiv = document.createElement('div');
                userActionsDiv.className = 'user-actions';

                const userCopyBtn = document.createElement('button');
                userCopyBtn.className = 'user-action-btn';
                userCopyBtn.title = 'Copiar mensaje';
                userCopyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
                userCopyBtn.onclick = async () => {
                    await copyAiMessage(t || "");
                    userCopyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                    setTimeout(() => {
                        userCopyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
                    }, 2000);
                };

                const userEditBtn = document.createElement('button');
                userEditBtn.className = 'user-action-btn';
                userEditBtn.title = 'Editar y reenviar';
                userEditBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
                userEditBtn.onclick = () => {
                    openEditModal(t || "", function(newText) {
                        sendEditedUserMessage(newText);
                    });
                };

                userActionsDiv.appendChild(userCopyBtn);
                userActionsDiv.appendChild(userEditBtn);
                w.appendChild(userActionsDiv);

            }

            chat.appendChild(w);

            chat.scrollTop = chat.scrollHeight;

        }

    }

    function escapeHtml(text) {

        if (!text) {
            return "";
        }

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

    }

    function toggleLoad(s) {

        if(s) {

            const existingLoader = document.getElementById('loader');

            if (existingLoader) {
                existingLoader.remove();
            }

            const l = document.createElement('div');

            l.id = 'loader';

            l.className = 'msg-wrapper ai-wrapper';

            l.innerHTML = '<div class="bubble ai-bubble dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

            chat.appendChild(l);

            chat.scrollTop = chat.scrollHeight;

        } else {

            const l = document.getElementById('loader');

            if(l) {
                l.remove();
            }

        }

    }

    async function copy(btn) {

        const codeElement = btn.nextElementSibling;

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            btn.innerText = "Listo";

            setTimeout(() => {

                btn.innerText = "Copiar";

            }, 2000);

        } catch (error) {

            const tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            btn.innerText = "Listo";

            setTimeout(() => {

                btn.innerText = "Copiar";

            }, 2000);

        }

    }

    async function copyCodeBlock(btn) {

        var wrapper = btn.closest('.code-block-wrapper');

        var codeElement = wrapper ? wrapper.querySelector('pre code') : null;

        if (!codeElement) {
            return;
        }

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            btn.textContent = 'Copiado';

            setTimeout(function() { btn.textContent = 'Copiar'; }, 2000);

        } catch (error) {

            var tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            btn.textContent = 'Copiado';

            setTimeout(function() { btn.textContent = 'Copiar'; }, 2000);

        }

    }

    async function copyCode(event, element) {

        event.preventDefault();

        const codeElement = element.querySelector("code");

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            const btn = element.parentElement.querySelector(".code-copy-btn");

            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = 'Copiado';
                setTimeout(function() { btn.textContent = originalText; }, 2000);
            }

        } catch (error) {

            const tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            const btn = element.parentElement.querySelector(".code-copy-btn");

            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = 'Copiado';
                setTimeout(function() { btn.textContent = originalText; }, 2000);
            }

        }

    }

    input.style.height = "48px";

    loadChats();
</script>
