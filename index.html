<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkMatter Pro AI</title>
    <style>
        :root {
            --bg-color: #14081f;
            --panel-color: #1e1030;
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.6);
            --text-primary: #f8fafc;
            --text-secondary: #c4b5fd;
            --user-bubble: linear-gradient(135deg, #9333ea, #6b21a8);
            --ai-bubble: linear-gradient(135deg, #2e1065, #1e1030);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 16, 48, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            z-index: 100;
            flex-shrink: 0;
            position: relative;
            animation: slideDown 0.5s ease-out forwards;
        }

        .title-small {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .status { font-size: 0.6rem; color: #c084fc; text-transform: uppercase; letter-spacing: 1px; animation: blink 2s ease-in-out infinite; }

        .menu-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.25);
            background: rgba(20, 8, 31, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            margin-right: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .menu-btn span {
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: white;
            transition: all 0.3s ease;
        }

        .menu-btn:active span:nth-child(1) {
            transform: rotate(-45deg) translateY(10px);
        }

        .menu-btn:active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn:active span:nth-child(3) {
            transform: rotate(45deg) translateY(-10px);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        #sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }

        #sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: #1a0c2a;
            z-index: 1000;
            border-right: 1px solid rgba(168, 85, 247, 0.25);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #sidebar.active {
            left: 0;
            animation: slideInLeft 0.3s ease-out forwards;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .sidebar-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
        }

        .new-chat-btn {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: #a855f7;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .new-chat-btn:active {
            transform: scale(0.95);
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-item {
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
            animation: slideInLeft 0.4s ease-out forwards;
        }

        .chat-item:hover {
            background: rgba(168, 85, 247, 0.16);
            transform: translateX(5px);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .chat-item.active {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            animation: glow 1.5s ease-in-out infinite;
        }

        .chat-item-title {
            font-size: 0.82rem;
            color: white;
            font-weight: bold;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item-preview {
            font-size: 0.7rem;
            color: #d8b4fe;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #chat-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 10px var(--accent-glow); }
            50% { text-shadow: 0 0 20px var(--accent-glow), 0 0 30px rgba(168, 85, 247, 0.8); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 12px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .msg-wrapper { max-width: 90%; display: flex; animation: slideUp 0.4s ease-out forwards; flex-direction: column; }
        .user-wrapper { align-self: flex-end; }
        .ai-wrapper { align-self: flex-start; }

        .bubble {
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 0.9rem;
            line-height: 1.5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }

        .bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.35);
        }

        .user-bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; animation: slideUp 0.5s ease-out forwards; }
        .ai-bubble { background: var(--ai-bubble); border: 1px solid rgba(168, 85, 247, 0.15); border-bottom-left-radius: 4px; animation: slideUp 0.5s ease-out forwards; }

        .code-block-wrapper {
            margin: 12px 0;
            border-radius: 12px;
            overflow: hidden;
            border-left: 3px solid var(--accent-color);
            background: #12061d;
            animation: slideUp 0.5s ease-out forwards;
            transition: all 0.3s ease;
        }

        .code-block-wrapper:hover {
            border-left-color: #d8b4fe;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #1e1030;
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            animation: slideDown 0.4s ease-out forwards;
        }

        .code-language {
            color: var(--accent-color);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .copy-indicator {
            color: #d8b4fe;
            font-size: 0.7rem;
            animation: fadeIn 0.5s ease-out forwards;
        }

        pre {
            background: #12061d;
            margin: 0;
            padding: 15px;
            border-radius: 0;
            font-family: monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            color: #e9d5ff;
            -webkit-user-select: text;
            user-select: text;
            animation: fadeIn 0.6s ease-out forwards;
        }

        pre code {
            display: block;
            min-width: max-content;
            white-space: pre;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 999;
            background: rgba(168, 85, 247, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 10px;
            font-size: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transform: translateX(0px);
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 12px;
            margin-bottom: 8px;
            color: #ffffff;
            animation: slideUp 0.5s ease-out forwards;
        }

        h1 {
            font-size: 1.5rem;
        }

        h2 {
            font-size: 1.3rem;
        }

        h3 {
            font-size: 1.1rem;
        }

        strong {
            color: #ffffff;
            font-weight: bold;
        }

        ul, ol {
            padding-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
            animation: slideUp 0.5s ease-out forwards;
        }

        li {
            margin-bottom: 6px;
            animation: slideUp 0.5s ease-out forwards;
        }

        .chat-img {
            max-width: 200px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.4s ease-out forwards;
            transition: all 0.3s ease;
        }

        .chat-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        #preview-container {
            display: none;
            padding: 10px 20px;
            background: var(--panel-color);
            border-top: 1px solid rgba(168, 85, 247, 0.25);
            position: relative;
            animation: slideUp 0.3s ease-out forwards;
        }

        #img-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
            animation: slideUp 0.3s ease-out forwards;
            transition: all 0.3s ease;
        }

        #img-preview:hover {
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        .close-preview {
            position: absolute;
            top: 5px;
            left: 75px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-preview:hover {
            background: #dc2626;
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .input-area-wrapper {
            background: var(--panel-color);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            padding: 10px 14px;
            padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 10px);
            display: flex;
            flex-direction: column;
            gap: 0px;
            flex-shrink: 0;
            position: relative;
            animation: slideUp 0.5s ease-out forwards;
        }

        .image-cooldown-text {
            display: none;
        }

        .input-area {
            padding: 0;
            background: transparent;
            border-top: none;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            padding-bottom: 0;
            align-items: center;
            justify-content: center;
        }

        .attach-btn-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .cooldown-badge {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.52rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.3px;
            pointer-events: none;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(168, 85, 247, 0.9);
            opacity: 0;
            transition: opacity 0.2s ease;
            border-radius: 50%;
            background: rgba(20, 8, 31, 0.72);
            z-index: 2;
        }

        .cooldown-badge.visible {
            opacity: 1;
        }

        .field {
            flex: 1;
            background: #14081f;
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 25px;
            padding: 12px 18px;
            color: white;
            outline: none;
            font-size: 16px;
            resize: none;
            min-height: 48px;
            height: 48px;
            max-height: 140px;
            overflow-y: auto;
            line-height: 1.5;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease-out forwards;
        }

        .field:focus { border-color: var(--accent-color); box-shadow: 0 0 15px var(--accent-glow); }

        .field:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            min-height: 48px;
            background: #7c3aed;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
            flex-shrink: 0;
            transition: 0.2s;
            align-self: center;
            animation: slideUp 0.5s ease-out forwards;
        }

        .btn-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.7);
        }

        .btn-icon:active {
            transform: scale(0.95);
        }

        .btn-icon.active {
            background: #a855f7;
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.8);
        }

        .btn-icon.active:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 1);
        }

        .btn-icon:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            box-shadow: none;
            background: #2a1045;
            transform: none;
            filter: brightness(0.5);
        }

        .attach-btn {
            background: #6d28d9;
            box-shadow: 0 0 10px rgba(109, 40, 217, 0.35);
            position: relative;
            overflow: hidden;
        }

        .attach-btn:hover {
            background: #7c3aed;
            box-shadow: 0 0 18px rgba(109, 40, 217, 0.6);
        }

        .attach-btn:disabled {
            background: #1e0a30;
            box-shadow: none;
            opacity: 0.35;
            filter: brightness(0.4);
        }

        .dots { display: flex; gap: 4px; padding: 10px; animation: fadeIn 0.3s ease-out forwards; }
        .dot { width: 5px; height: 5px; background: var(--accent-color); border-radius: 50%; animation: pulse 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; transform: scale(1.2); } }

        .ai-actions {
            display: flex;
            gap: 10px;
            margin-top: 6px;
            padding-left: 4px;
            align-items: center;
        }

        .ai-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: rgba(196, 181, 253, 0.5);
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease, transform 0.2s ease;
            line-height: 1;
        }

        .ai-action-btn:hover {
            color: rgba(196, 181, 253, 1);
            transform: scale(1.2);
        }

        .ai-action-btn:active {
            transform: scale(0.9);
        }

        .ai-action-btn svg {
            width: 14px;
            height: 14px;
        }

        .stop-btn-icon {
            background: #7c3aed;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
        }

        .stop-btn-icon:hover {
            background: #ef4444;
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.7);
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">Chats guardados</div>
        <button class="new-chat-btn" onclick="createNewChat()">+ Nuevo</button>
    </div>

    <div id="chat-list"></div>
</div>

<header>
    <div class="header-left">
        <button class="menu-btn" onclick="toggleSidebar()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="title-small">DARKMATTER IA</div>
    </div>

    <div class="status">● ONLINE</div>
</header>

<div id="chat-view">
</div>

<div id="preview-container">
    <img id="img-preview" src="">
    <div class="close-preview" onclick="clearImage()">×</div>
</div>

<div class="input-area-wrapper">
    <div class="image-cooldown-text" id="imageCooldownText"></div>

    <div class="input-area">
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFile(this)">
        <div class="attach-btn-wrapper">
            <button class="btn-icon attach-btn" id="attachButton" onclick="document.getElementById('fileInput').click()">
                <span class="cooldown-badge" id="cooldownBadge"></span>
                <svg id="attachIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
        </div>
        <textarea id="userInput" class="field" placeholder="Escribe un comando..." autocomplete="off" enterkeyhint="enter"></textarea>
        <button class="btn-icon active" id="sendButton" onclick="handleSendOrStop()">
            <svg id="sendIcon" viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
            <svg id="stopIcon" viewBox="0 0 24 24" width="20" height="20" fill="white" style="display:none;"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
    </div>
</div>

<script>
    const KEY = "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";
    const chat = document.getElementById('chat-view');
    const input = document.getElementById('userInput');
    const sendButton = document.getElementById('sendButton');
    const attachButton = document.getElementById('attachButton');
    const fileInput = document.getElementById('fileInput');
    const imageCooldownText = document.getElementById('imageCooldownText');
    const cooldownBadge = document.getElementById('cooldownBadge');
    const sendIcon = document.getElementById('sendIcon');
    const stopIcon = document.getElementById('stopIcon');

    let currentBase64 = null;
    let lastImageBase64 = null;
    let lastCompressedImageBase64 = null;
    let lastUserText = "";
    let isGeneratingResponse = false;
    let isMobileEnterPressed = false;
    let abortController = null;

    const IMAGE_COOLDOWN_TIME = 120000;

    const systemPrompt = {
        role: "system",
        content: `Eres DarkMatter Pro AI. Responde siempre en español. Cuando el usuario te haga una pregunta, responde de forma completa, detallada y bien explicada. No des resúmenes a menos que el usuario lo pida explícitamente. Explica cada concepto con claridad, da ejemplos cuando sea útil, desarrolla los temas paso a paso y asegúrate de que el usuario entienda bien el tema. Si el usuario te pide que seas más corto, más resumido o más conciso, entonces adáptate a eso. Si recibes una imagen, analízala detalladamente. Siempre sé exhaustivo en tus explicaciones por defecto.`
    };

    let conversationHistory = [systemPrompt];

    let chats = [];
    let currentChatId = null;

    function generateChatId() {
        return "chat_" + Date.now() + "_" + Math.floor(Math.random() * 999999);
    }

    function generateChatTitle(text) {

        if (!text || text.trim() === "") {
            return "Nuevo chat";
        }

        let clean = text.trim();

        if (clean.length > 32) {
            clean = clean.substring(0, 32) + "...";
        }

        return clean;

    }

    async function generateAiChatTitle(userText) {

        try {

            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-4-scout-17b-16e-instruct",
                    messages: [
                        {
                            role: "system",
                            content: "Eres un asistente que genera títulos muy cortos para conversaciones. Dado el primer mensaje del usuario, genera un título de máximo 5 palabras que resuma el tema. Responde SOLO con el título, sin comillas, sin puntos, sin explicaciones adicionales."
                        },
                        {
                            role: "user",
                            content: userText
                        }
                    ],
                    temperature: 0.5,
                    max_tokens: 20
                })
            });

            if (r.ok) {

                const d = await r.json();

                if (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) {

                    let title = d.choices[0].message.content.trim();

                    title = title.replace(/^["']|["']$/g, '');

                    if (title.length > 40) {
                        title = title.substring(0, 40) + "...";
                    }

                    return title;

                }

            }

        } catch (e) {

        }

        return generateChatTitle(userText);

    }

    function getImageCooldownRemaining() {

        const elapsed = Date.now() - parseInt(savedTime);

        const remaining = IMAGE_COOLDOWN_TIME - elapsed;

        if (remaining < 0) {
            return 0;

        return remaining;

    }

    function formatCooldownTime(ms) {
        const totalSeconds = Math.ceil(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }

    async function compressImage(base64, quality = 0.75, maxWidth = 1024) {

        return new Promise((resolve) => {

            const img = new Image();

            img.onload = function() {

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                const canvas = document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(img, 0, 0, width, height);

                const compressed = canvas.toDataURL("image/jpeg", quality);

                resolve(compressed);

            };

            img.src = base64;

        });

    }

    async function handleFile(input) {

        const remainingCooldown = getImageCooldownRemaining();

        if (remainingCooldown > 0) {

            document.getElementById('fileInput').value = '';

            return;

        }

        const file = input.files[0];

        if (!file) {
            return;
        }

        if (!file.type.startsWith("image/")) {
            addMsg("Solo se permiten archivos de imagen.", 'ai');
            return;
        }

        if (file.size > 20000000) {
            addMsg("La imagen supera el límite permitido de 20MB.", 'ai');
            return;
        }

        localStorage.setItem("darkmatter_last_image_time", Date.now().toString());

        updateImageCooldownUI();

        const reader = new FileReader();

        reader.onload = async function(e) {

            const originalBase64 = e.target.result;

            const compressedBase64 = await compressImage(originalBase64);

            currentBase64 = compressedBase64;

            document.getElementById('img-preview').src = currentBase64;
            document.getElementById('preview-container').style.display = 'block';
            attachButton.classList.add("active");

        };

        reader.onerror = function() {
            addMsg("No se pudo leer la imagen seleccionada.", 'ai');
        };

        reader.readAsDataURL(file);

    }

    function optimizeConversationHistory() {

        const systemMessage = conversationHistory[0];
        const messageCount = conversationHistory.length - 1;

        let recentMessages = [];

        if (messageCount > 20) {
            recentMessages = conversationHistory.slice(-8);
        } else if (messageCount > 12) {
            recentMessages = conversationHistory.slice(-6);
        } else {
            recentMessages = conversationHistory.slice(-4);
        }

        conversationHistory = [
            systemMessage,
            ...recentMessages
        ];

    }

    function extractRetrySeconds(errorMessage) {

        const regex = /try again in ([0-9.]+)s/i;

        const match = errorMessage.match(regex);

        if (match && match[1]) {
            return Math.ceil(parseFloat(match[1]));
        }

        return 5;

    }

    function wait(ms) {

        return new Promise(resolve => setTimeout(resolve, ms));

    }

    async function sendRequestWithRetry(requestBody, signal) {

        while (true) {

            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody),
                signal: signal
            });

            if (r.ok) {
                return r;
            }

            let errorText = await r.text();

            try {

                const errorJson = JSON.parse(errorText);

                if (errorJson.error && errorJson.error.message) {

                    const errorMessage = errorJson.error.message;

                    if (errorMessage.toLowerCase().includes("rate limit")) {

                        const seconds = extractRetrySeconds(errorMessage);

                        await wait(seconds * 1000);

                        continue;

                    }

                }

            } catch {

            }

            throw new Error(errorText);

        }

    }

            if (tempImage) {

                userMessage = {
                    role: "user",
                    content: [

                            type: "text",
                            text: `Analiza esta imagen detalladamente. Lee todo el texto visible. Si es un ejercicio o guía, resuelve cada punto con claridad. Explica procedimientos paso a paso. Usa texto normal, no LaTeX. ${text ? "Pregunta: " + text : ""}`
                        },

                                url: tempImage
                            }

                };

            } else {

                                text: `Basándote en la imagen anterior: ${text}`
                            },
                            {

                                }

                    };

                } else {

                    };

            }

            conversationHistory.push(userMessage);

            optimizeConversationHistory();

            const requestBody = {

                messages: conversationHistory,

                max_tokens: 2048

            const r = await sendRequestWithRetry(requestBody, abortController.signal);

            toggleLoad(false);

            if(d.choices && d.choices[0] && d.choices[0].message) {

                const aiResponse = cleanResponse(d.choices[0].message.content);

                conversationHistory.push({

                });

            setGeneratingState(false);

            clearGeneratingState();

            input.style.height = "48px";
            input.scrollTop = 0;

        }

    async function regenerateLastResponse() {

        if (isGeneratingResponse) {
            return;
        }

        const currentChat = chats.find(c => c.id === currentChatId);

        if (!currentChat) {
            return;
        }

        const messages = currentChat.messages;

        let lastUserMsgIndex = -1;

        for (let i = messages.length - 1; i >= 0; i--) {
            if (messages[i].type === 'user') {
                lastUserMsgIndex = i;
                break;
            }
        }

        if (lastUserMsgIndex === -1) {
            return;
        }

        const lastUserMsg = messages[lastUserMsgIndex];

        if (conversationHistory.length > 1) {
            const lastHistoryMsg = conversationHistory[conversationHistory.length - 1];
            if (lastHistoryMsg.role === 'assistant') {
                conversationHistory.pop();
            }
        }

        abortController = new AbortController();

        saveGeneratingState();

        setGeneratingState(true);

        toggleLoad(true);

        try {

            const requestBody = {
                model: "meta-llama/llama-4-scout-17b-16e-instruct",
                messages: conversationHistory,
                temperature: 0.5,
                max_tokens: 2048
            };

            const r = await sendRequestWithRetry(requestBody, abortController.signal);

            toggleLoad(false);

            const d = await r.json();

            if(d.choices && d.choices[0] && d.choices[0].message) {

                conversationHistory.push({
                    role: "assistant",

                });

                updateCurrentChatStorage();

                const lastAiWrapper = allWrappers[allWrappers.length - 1];

                if (lastAiWrapper) {

                    if (currentChat.messages.length > 0 && currentChat.messages[currentChat.messages.length - 1].type === 'ai') {
                        currentChat.messages.pop();
                    }
                }

                addMsg(aiResponse, 'ai');
                await addMessageToCurrentChat('ai', aiResponse, null, true);

            } else if (d.error) {

                if (d.error.code === "rate_limit_exceeded") {

                } else {
                    addMsg("Error de la IA: " + d.error.message, 'ai');
                }

                addMsg("Respuesta inesperada del servidor.", 'ai');

    async function copyAiMessage(text) {

    function cleanResponse(text) {

        if (!text) {
            return "";
        }

        let cleaned = text;

        cleaned = cleaned.replace(/\\\(/g, "");
        cleaned = cleaned.replace(/\\\)/g, "");

        cleaned = cleaned.replace(/\\times/g, "×");
        cleaned = cleaned.replace(/\\text\{([^}]*)\}/g, "$1");

        cleaned = cleaned.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "$1/$2");

        cleaned = cleaned.replace(/\\\\/g, "");

        cleaned = cleaned.replace(/\$/g, "");

        cleaned = cleaned.replace(/```math/g, "```math");
        cleaned = cleaned.replace(/```lua/g, "```lua");
        cleaned = cleaned.replace(/```luau/g, "```luau");
        cleaned = cleaned.replace(/```html/g, "```html");
        cleaned = cleaned.replace(/```css/g, "```css");
        cleaned = cleaned.replace(/```javascript/g, "```javascript");
        cleaned = cleaned.replace(/```js/g, "```js");
        cleaned = cleaned.replace(/```python/g, "```python");

        cleaned = cleaned.replace(/\\,/g, "");

        cleaned = cleaned.replace(/\\=/g, "=");

        cleaned = cleaned.replace(/\\/g, "");

        return cleaned;

    }

    function parseMarkdown(text) {

        if (!text) {
            return "";
        }

        let parsed = escapeHtml(text);

        parsed = parsed.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        parsed = parsed.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        parsed = parsed.replace(/^# (.*$)/gim, '<h1>$1</h1>');

        parsed = parsed.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');

        parsed = parsed.replace(/^\* (.*$)/gim, '<li>$1</li>');
        parsed = parsed.replace(/^\- (.*$)/gim, '<li>$1</li>');

        parsed = parsed.replace(/(<li>.*<\/li>)/gims, '<ul>$1</ul>');

        parsed = parsed.replace(/\n/g, '<br>');

        parsed = parsed.replace(/<\/ul><br><ul>/g, '');

        return parsed;

    }

    function detectLanguage(codeText) {

        const firstLine = codeText.split('\n')[0].trim().toLowerCase();

        const languageList = [
            "html",
            "css",
            "javascript",
            "js",
            "python",
            "lua",
            "luau",
            "java",
            "cpp",
            "csharp",
            "php",
            "json"
        ];

        if (languageList.includes(firstLine)) {
            return firstLine;
        }

        return "código";

    }

    function removeLanguageLine(codeText, language) {

        const lines = codeText.split('\n');

        if (lines[0].trim().toLowerCase() === language.toLowerCase()) {
            lines.shift();
        }

        return lines.join('\n');

    }

    function addMsg(t, type, img = null, shouldSave = true) {

        const w = document.createElement('div');

        w.className = `msg-wrapper ${type}-wrapper`;

        if (img) {

            const i = document.createElement('img');

        }

        const b = document.createElement('div');

        b.className = `bubble ${type}-bubble`;

        if(t && t.includes('```')) {

            const p = t.split('```');

            b.innerHTML = p.map((c, i) => {

                if (i % 2 === 1) {

                    const detectedLanguage = detectLanguage(c.trim());

                    const cleanCode = removeLanguageLine(c.trim(), detectedLanguage);

                    return `
<div class="code-block-wrapper">
    <div class="code-header">
        <div class="code-language">${escapeHtml(detectedLanguage)}</div>
        <div class="copy-indicator">Mantén presionado para copiar</div>
    </div>
    <pre oncontextmenu="copyCode(event, this)"><code>${escapeHtml(cleanCode)}</code></pre>
</div>`;

                }

                return parseMarkdown(c);

            }).join('');

        } else if (t) {

            b.innerHTML = parseMarkdown(t);

        }

        if (t || img) {

            w.appendChild(b);

            if (type === 'ai') {

                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'ai-actions';

                const copyBtn = document.createElement('button');
                copyBtn.className = 'ai-action-btn';
                copyBtn.title = 'Copiar respuesta';
                copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
                copyBtn.onclick = async () => {
                    await copyAiMessage(t || "");
                    copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
                    setTimeout(() => {
                        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
                    }, 2000);
                };

                const regenBtn = document.createElement('button');
                regenBtn.className = 'ai-action-btn';
                regenBtn.title = 'Regenerar respuesta';
                regenBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>`;
                regenBtn.onclick = () => {
                    regenerateLastResponse();
                };

                actionsDiv.appendChild(copyBtn);
                actionsDiv.appendChild(regenBtn);
                w.appendChild(actionsDiv);

            }

            chat.appendChild(w);

            chat.scrollTop = chat.scrollHeight;

        }

    }

    function escapeHtml(text) {

        if (!text) {
            return "";
        }

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

    }

    function toggleLoad(s) {

        if(s) {

            const existingLoader = document.getElementById('loader');

            if (existingLoader) {
                existingLoader.remove();
            }

            const l = document.createElement('div');

            l.id = 'loader';

            l.className = 'msg-wrapper ai-wrapper';

            l.innerHTML = '<div class="bubble ai-bubble dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';

            chat.appendChild(l);

            chat.scrollTop = chat.scrollHeight;

        } else {

            const l = document.getElementById('loader');

            if(l) {
                l.remove();
            }

        }

    }

    async function copy(btn) {

        const codeElement = btn.nextElementSibling;

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            btn.innerText = "¡Listo!";

            setTimeout(() => {

                btn.innerText = "Copiar";

            }, 2000);

        } catch (error) {

            const tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            btn.innerText = "¡Listo!";

            setTimeout(() => {

                btn.innerText = "Copiar";

            }, 2000);

        }

    }

    async function copyCode(event, element) {

        event.preventDefault();

        const codeElement = element.querySelector("code");

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            const indicator = element.parentElement.querySelector(".copy-indicator");

            const originalText = indicator.innerText;

            indicator.innerText = "¡Código copiado!";

            setTimeout(() => {

                indicator.innerText = originalText;

            }, 2000);

        } catch (error) {

            const tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            const indicator = element.parentElement.querySelector(".copy-indicator");

            const originalText = indicator.innerText;

            indicator.innerText = "¡Código copiado!";

            setTimeout(() => {

                indicator.innerText = originalText;

            }, 2000);

        }

    }

    input.style.height = "48px";

    loadChats();
</script>
