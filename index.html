<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkMatter Pro AI</title>
    <style>
        :root {
            --bg-color: #020617;
            --panel-color: #0f172a;
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --user-bubble: linear-gradient(135deg, #1d4ed8, #1e40af);
            --ai-bubble: linear-gradient(135deg, #1e293b, #0f172a);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(59, 130, 246, 0.2);
            z-index: 100;
        }

        .title-small {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .status { font-size: 0.6rem; color: #10b981; text-transform: uppercase; letter-spacing: 1px; }

        #chat-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .msg-wrapper { max-width: 90%; display: flex; animation: slideUp 0.4s ease-out forwards; }
        .user-wrapper { align-self: flex-end; }
        .ai-wrapper { align-self: flex-start; }

        .bubble {
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 0.9rem;
            line-height: 1.5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .user-bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
        .ai-bubble { background: var(--ai-bubble); border: 1px solid rgba(59, 130, 246, 0.1); border-bottom-left-radius: 4px; }

        pre {
            background: #000;
            margin: 12px 0;
            padding: 15px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            border-left: 3px solid var(--accent-color);
            position: relative;
            color: #7dd3fc;
        }

        .copy-btn {
            position: absolute;
            top: 5px; right: 5px;
            background: rgba(59, 130, 246, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 2px 8px;
            font-size: 0.6rem;
            border-radius: 4px;
            cursor: pointer;
        }

        .input-area {
            padding: 15px 20px 35px;
            background: var(--panel-color);
            border-top: 1px solid rgba(59, 130, 246, 0.2);
            display: flex;
            gap: 10px;
        }

        .field {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 25px;
            padding: 12px 20px;
            color: white;
            outline: none;
        }

        .field:focus { border-color: var(--accent-color); box-shadow: 0 0 15px var(--accent-glow); }

        .send {
            width: 45px; height: 45px;
            background: var(--accent-color);
            border: none; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 0 15px var(--accent-glow);
        }

        /* Typing Dots */
        .dots { display: flex; gap: 4px; padding: 10px; }
        .dot { width: 5px; height: 5px; background: var(--accent-color); border-radius: 50%; animation: pulse 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; transform: scale(1.2); } }
    </style>
</head>
<body>

<header>
    <div class="title-small">DARKMATTER IA</div>
    <div class="status">● ONLINE</div>
</header>

<div id="chat-view">
    <div class="msg-wrapper ai-wrapper">
        <div class="bubble ai-bubble">Núcleo DarkMatter iniciado. Esperando instrucciones técnicas...</div>
    </div>
</div>

<div class="input-area">
    <input type="text" id="userInput" class="field" placeholder="Escribe un comando..." autocomplete="off">
    <button class="send" onclick="send()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
    </button>
</div>

<script>
    const KEY = "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";
    const chat = document.getElementById('chat-view');
    const input = document.getElementById('userInput');

    input.addEventListener('keypress', (e) => { if(e.key === 'Enter') send(); });

    async function send() {
        const text = input.value.trim();
        if(!text) return;

        addMsg(text, 'user');
        input.value = '';
        toggleLoad(true);

        try {
            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${KEY}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: "Eres DarkMatter Pro AI. Experto en Luau, PHP y Firebase." }, { role: "user", content: text }]
                })
            });
            const d = await r.json();
            toggleLoad(false);
            if(d.choices) addMsg(d.choices[0].message.content, 'ai');
        } catch(e) { 
            toggleLoad(false);
            addMsg("Error de conexión al núcleo.", 'ai');
        }
    }

    function addMsg(t, type) {
        const w = document.createElement('div');
        w.className = `msg-wrapper ${type}-wrapper`;
        const b = document.createElement('div');
        b.className = `bubble ${type}-bubble`;
        
        if(t.includes('```')) {
            const p = t.split('```');
            b.innerHTML = p.map((c, i) => i % 2 === 1 ? `<pre><button class="copy-btn" onclick="copy(this)">Copiar</button><code>${c.trim()}</code></pre>` : c).join('');
        } else { b.innerText = t; }

        w.appendChild(b);
        chat.appendChild(w);
        chat.scrollTop = chat.scrollHeight;
    }

    function toggleLoad(s) {
        if(s) {
            const l = document.createElement('div');
            l.id = 'loader';
            l.className = 'msg-wrapper ai-wrapper';
            l.innerHTML = '<div class="bubble ai-bubble dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
            chat.appendChild(l);
            chat.scrollTop = chat.scrollHeight;
        } else {
            const l = document.getElementById('loader');
            if(l) l.remove();
        }
    }

    function copy(btn) {
        navigator.clipboard.writeText(btn.nextElementSibling.innerText);
        btn.innerText = "¡Listo!";
        setTimeout(() => btn.innerText = "Copiar", 2000);
    }
</script>

</body>
</html>
