<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkMatter Pro AI</title>
    <style>
        :root {
            --bg-color: #14081f;
            --panel-color: #1e1030;
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.6);
            --text-primary: #f8fafc;
            --text-secondary: #c4b5fd;
            --user-bubble: linear-gradient(135deg, #9333ea, #6b21a8);
            --ai-bubble: linear-gradient(135deg, #2e1065, #1e1030);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 16, 48, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            z-index: 100;
            flex-shrink: 0;
            position: relative;
            animation: slideDown 0.5s ease-out forwards;
        }

        .title-small {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .status { font-size: 0.6rem; color: #c084fc; text-transform: uppercase; letter-spacing: 1px; animation: blink 2s ease-in-out infinite; }

        .menu-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.25);
            background: rgba(20, 8, 31, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            margin-right: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .menu-btn span {
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: white;
            transition: all 0.3s ease;
        }

        .menu-btn:active span:nth-child(1) {
            transform: rotate(-45deg) translateY(10px);
        }

        .menu-btn:active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn:active span:nth-child(3) {
            transform: rotate(45deg) translateY(-10px);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        #sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }

        #sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: #1a0c2a;
            z-index: 1000;
            border-right: 1px solid rgba(168, 85, 247, 0.25);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #sidebar.active {
            left: 0;
            animation: slideInLeft 0.3s ease-out forwards;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .sidebar-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
        }

        .new-chat-btn {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: #a855f7;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .new-chat-btn:active {
            transform: scale(0.95);
        }

        /* NUEVO: Sección de modos en el sidebar */
        .sidebar-modes-section {
            padding: 12px 10px 6px 10px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            animation: fadeIn 0.5s ease-out forwards;
        }

        .sidebar-modes-label {
            font-size: 0.65rem;
            font-weight: bold;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .modes-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        .mode-btn {
            background: rgba(168, 85, 247, 0.07);
            border: 1px solid rgba(168, 85, 247, 0.18);
            border-radius: 12px;
            padding: 9px 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #e9d5ff;
            font-size: 0.72rem;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
        }

        .mode-btn:hover {
            background: rgba(168, 85, 247, 0.18);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.25);
            transform: scale(1.03);
        }

        .mode-btn:active {
            transform: scale(0.96);
        }

        .mode-btn.active-mode {
            background: rgba(168, 85, 247, 0.28);
            border-color: #a855f7;
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.45);
            color: #ffffff;
        }

        .mode-btn .mode-icon {
            font-size: 1.3rem;
        }

        .mode-btn .mode-name {
            font-size: 0.68rem;
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-item {
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
            animation: slideInLeft 0.4s ease-out forwards;
        }

        .chat-item:hover {
            background: rgba(168, 85, 247, 0.16);
            transform: translateX(5px);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .chat-item.active {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            animation: glow 1.5s ease-in-out infinite;
        }

        .chat-item-title {
            font-size: 0.82rem;
            color: white;
            font-weight: bold;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item-preview {
            font-size: 0.7rem;
            color: #d8b4fe;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #chat-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 10px var(--accent-glow); }
            50% { text-shadow: 0 0 20px var(--accent-glow), 0 0 30px rgba(168, 85, 247, 0.8); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 12px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .msg-wrapper { max-width: 90%; display: flex; animation: slideUp 0.4s ease-out forwards; flex-direction: column; }
        .user-wrapper { align-self: flex-end; }
        .ai-wrapper { align-self: flex-start; }

        .bubble {
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 0.9rem;
            line-height: 1.5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            white-space: pre-wrap;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }

        .bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.35);
        }

        .user-bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; animation: slideUp 0.5s ease-out forwards; }
        .ai-bubble { background: var(--ai-bubble); border: 1px solid rgba(168, 85, 247, 0.15); border-bottom-left-radius: 4px; animation: slideUp 0.5s ease-out forwards; }

        .code-block-wrapper {
            margin: 12px 0;
            border-radius: 12px;
            overflow: hidden;
            border-left: 3px solid var(--accent-color);
            background: #12061d;
            animation: slideUp 0.5s ease-out forwards;
            transition: all 0.3s ease;
        }

        .code-block-wrapper:hover {
            border-left-color: #d8b4fe;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: #1e1030;
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            animation: slideDown 0.4s ease-out forwards;
        }

        .code-language {
            color: var(--accent-color);
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .copy-indicator {
            color: #d8b4fe;
            font-size: 0.7rem;
            animation: fadeIn 0.5s ease-out forwards;
        }

        pre {
            background: #12061d;
            margin: 0;
            padding: 15px;
            border-radius: 0;
            font-family: monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            color: #e9d5ff;
            -webkit-user-select: text;
            user-select: text;
            animation: fadeIn 0.6s ease-out forwards;
        }

        pre code {
            display: block;
            min-width: max-content;
            white-space: pre;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 999;
            background: rgba(168, 85, 247, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 10px;
            font-size: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transform: translateX(0px);
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 12px;
            margin-bottom: 8px;
            color: #ffffff;
            animation: slideUp 0.5s ease-out forwards;
        }

        h1 {
            font-size: 1.5rem;
        }

        h2 {
            font-size: 1.3rem;
        }

        h3 {
            font-size: 1.1rem;
        }

        strong {
            color: #ffffff;
            font-weight: bold;
        }

        ul, ol {
            padding-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
            animation: slideUp 0.5s ease-out forwards;
        }

        li {
            margin-bottom: 6px;
            animation: slideUp 0.5s ease-out forwards;
        }

        .chat-img {
            max-width: 200px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.4s ease-out forwards;
            transition: all 0.3s ease;
        }

        .chat-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        #preview-container {
            display: none;
            padding: 10px 20px;
            background: var(--panel-color);
            border-top: 1px solid rgba(168, 85, 247, 0.25);
            position: relative;
            animation: slideUp 0.3s ease-out forwards;
        }

        #img-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
            animation: slideUp 0.3s ease-out forwards;
            transition: all 0.3s ease;
        }

        #img-preview:hover {
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        .close-preview {
            position: absolute;
            top: 5px;
            left: 75px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-preview:hover {
            background: #dc2626;
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .input-area-wrapper {
            background: var(--panel-color);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            padding: 10px 14px;
            padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 10px);
            display: flex;
            flex-direction: column;
            gap: 0px;
            flex-shrink: 0;
            position: relative;
            animation: slideUp 0.5s ease-out forwards;
        }

        .image-cooldown-text {
            font-size: 0.65rem;
            color: #ede9fe;
            text-align: center;
            min-height: 0px;
            height: 0px;
            overflow: hidden;
            background: rgba(91, 33, 182, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 999px;
            padding: 0px;
            width: fit-content;
            max-width: 100%;
            align-self: center;
            backdrop-filter: blur(6px);
            transition: 0.2s ease;
            margin: 0;
            opacity: 0;
        }

        .image-cooldown-text.active {
            min-height: 12px;
            height: auto;
            padding: 3px 10px;
            margin-bottom: 6px;
            opacity: 1;
            animation: slideDown 0.3s ease-out forwards;
        }

        .input-area {
            padding: 0;
            background: transparent;
            border-top: none;
            display: flex;
            gap: 10px;
            flex-shrink: 0;
            padding-bottom: 0;
            align-items: center;
            justify-content: center;
        }

        .field {
            flex: 1;
            background: #14081f;
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 25px;
            padding: 12px 18px;
            color: white;
            outline: none;
            font-size: 16px;
            resize: none;
            min-height: 48px;
            height: 48px;
            max-height: 140px;
            overflow-y: auto;
            line-height: 1.5;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            animation: slideUp 0.5s ease-out forwards;
        }

        .field:focus { border-color: var(--accent-color); box-shadow: 0 0 15px var(--accent-glow); }

        .field:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-icon {
            width: 48px;
            height: 48px;
            min-width: 48px;
            min-height: 48px;
            background: #7c3aed;
            border: none;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
            flex-shrink: 0;
            transition: 0.2s;
            align-self: center;
            animation: slideUp 0.5s ease-out forwards;
        }

        .btn-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 18px rgba(124, 58, 237, 0.7);
        }

        .btn-icon:active {
            transform: scale(0.95);
        }

        .btn-icon.active {
            background: #a855f7;
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.8);
            animation: float 1.5s ease-in-out infinite;
        }

        .btn-icon.active:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 1);
        }

        .btn-icon:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            background: #4c1d95;
            transform: none;
        }

        .attach-btn {
            background: #6d28d9;
            box-shadow: 0 0 10px rgba(109, 40, 217, 0.35);
        }

        .attach-btn:hover {
            background: #7c3aed;
            box-shadow: 0 0 18px rgba(109, 40, 217, 0.6);
        }

        /* MODIFICADO: Loader compacto — las bolitas no tienen padding extra */
        .dots {
            display: flex;
            gap: 4px;
            padding: 4px 6px;
            animation: fadeIn 0.3s ease-out forwards;
        }
        .dot { width: 5px; height: 5px; background: var(--accent-color); border-radius: 50%; animation: pulse 1.5s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; transform: scale(1.2); } }

        /* MODIFICADO: Contador oculto por defecto, sin espacio; cuando aparece se expande */
        .loader-timer {
            font-size: 0.65rem;
            color: #c084fc;
            text-align: center;
            letter-spacing: 1px;
            font-family: monospace;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            padding: 0;
            margin: 0;
            transition: max-height 0.4s ease, opacity 0.4s ease, padding 0.4s ease, margin 0.4s ease;
        }

        .loader-timer.visible {
            max-height: 30px;
            opacity: 1;
            padding-top: 4px;
            margin-top: 2px;
        }

        /* NUEVO: Contador final debajo de la respuesta */
        .response-timer {
            font-size: 0.65rem;
            color: #9d6fe0;
            margin-top: 6px;
            padding: 4px 10px;
            background: rgba(168, 85, 247, 0.08);
            border-radius: 999px;
            border: 1px solid rgba(168, 85, 247, 0.15);
            width: fit-content;
            font-family: monospace;
            letter-spacing: 1px;
            animation: fadeIn 0.4s ease-out forwards;
        }

        /* NUEVO: Botón de pausa (stop) */
        .btn-icon.stop-mode {
            background: #dc2626;
            box-shadow: 0 0 18px rgba(220, 38, 38, 0.7);
            animation: none;
        }

        .btn-icon.stop-mode:hover {
            background: #ef4444;
            box-shadow: 0 0 25px rgba(220, 38, 38, 0.9);
            transform: scale(1.1);
        }

        /* NUEVO: Mini menú contextual para mensajes IA */
        .msg-context-menu {
            position: fixed;
            z-index: 9999;
            background: #1e1030;
            border: 1px solid rgba(168, 85, 247, 0.35);
            border-radius: 14px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            animation: slideUp 0.2s ease-out forwards;
            min-width: 150px;
        }

        .msg-context-menu button {
            background: transparent;
            border: none;
            color: #e9d5ff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease;
        }

        .msg-context-menu button:hover {
            background: rgba(168, 85, 247, 0.2);
        }

        .msg-context-menu button:active {
            background: rgba(168, 85, 247, 0.35);
        }

        /* NUEVO: Badge de modo activo en el header */
        .mode-badge {
            font-size: 0.6rem;
            background: rgba(168, 85, 247, 0.25);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 999px;
            padding: 2px 8px;
            color: #d8b4fe;
            letter-spacing: 1px;
            font-weight: bold;
            margin-left: 8px;
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .mode-badge.visible {
            display: inline-block;
        }
    </style>
</head>
<body>

<div id="sidebar-overlay" onclick="toggleSidebar(false)"></div>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-title">Chats guardados</div>
        <button class="new-chat-btn" onclick="createNewChat()">+ Nuevo</button>
    </div>

    <!-- NUEVO: Sección de modos de IA -->
    <div class="sidebar-modes-section">
        <div class="sidebar-modes-label">Modo de IA</div>
        <div class="modes-grid">
            <button class="mode-btn active-mode" id="modeBtn-default" onclick="setMode('default')">
                <span class="mode-icon">🤖</span>
                <span class="mode-name">Normal</span>
            </button>
            <button class="mode-btn" id="modeBtn-exam" onclick="setMode('exam')">
                <span class="mode-icon">📝</span>
                <span class="mode-name">Copiar examen</span>
            </button>
            <button class="mode-btn" id="modeBtn-teacher" onclick="setMode('teacher')">
                <span class="mode-icon">🎓</span>
                <span class="mode-name">Profesor</span>
            </button>

    // MODIFICADO: El título ya no se genera aquí, se genera por IA en generateChatTitleWithAI
    function generateChatTitle(text) {

        if (!text || text.trim() === "") {
            return "Nuevo chat";
        }

        let clean = text.trim();

        if (clean.length > 32) {
            clean = clean.substring(0, 32) + "...";
        }

        return clean;

    }

    // NUEVO: Generar título con IA de forma asíncrona
    async function generateChatTitleWithAI(userText, chatId) {

        if (!userText || userText.trim() === "") {
            return;
        }

        try {

            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-4-scout-17b-16e-instruct",
                    messages: [
                        {
                            role: "system",
                            content: "Eres un asistente que genera títulos cortos para conversaciones. Responde SOLO con el título, sin comillas, sin puntos al final, sin explicaciones. El título debe tener máximo 5 palabras y resumir de qué trata el mensaje del usuario."
                        },
                        {
                            role: "user",
                            content: "Genera un título corto para esta conversación: " + userText.substring(0, 200)
                        }
                    ],
                    temperature: 0.4,
                    max_tokens: 30
                })
            });

            if (!r.ok) {
                return;
            }

            const d = await r.json();

            if (d.choices && d.choices[0] && d.choices[0].message) {

                let aiTitle = d.choices[0].message.content.trim();

                // Limpiar el título: quitar comillas, puntos finales, etc.
                aiTitle = aiTitle.replace(/^["']|["']$/g, "");
                aiTitle = aiTitle.replace(/\.+$/, "");
                aiTitle = aiTitle.trim();

                if (aiTitle.length > 40) {
                    aiTitle = aiTitle.substring(0, 40) + "...";
                }

                if (aiTitle.length > 0) {

                    const targetChat = chats.find(c => c.id === chatId);

                    if (targetChat) {
                        targetChat.title = aiTitle;
                        saveChats();
                        renderChatList();
                    }

                }

            }

        } catch (e) {
            // Si falla la generación del título por IA, se queda el título corto del texto
        }

    function renderChatList() {

        const chatList = document.getElementById("chat-list");

        chatList.innerHTML = "";

        // MODIFICADO: Solo renderizar chats que tengan al menos un mensaje del usuario
        const visibleChats = chats.filter(c => {

            return c.messages.some(m => m.type === "user");
        });

        visibleChats.forEach(chatData => {

            const item = document.createElement("div");

            item.className = "chat-item";

            if (chatData.id === currentChatId) {
                item.classList.add("active");
            }

            item.onclick = () => {

                toggleSidebar(false);
            };

            const previewText = chatData.messages.length > 0

            item.innerHTML = `
                <div class="chat-item-title">${escapeHtml(chatData.title)}</div>
                <div class="chat-item-preview">${escapeHtml(previewText || "Sin mensajes")}</div>
            `;

            chatList.appendChild(item);

        });

    }

    function openChat(chatId) {

        const selectedChat = chats.find(c => c.id === chatId);

        if (!selectedChat) {
            return;
        }

        currentChatId = chatId;

        conversationHistory = selectedChat.history;

        chat.innerHTML = "";

        selectedChat.messages.forEach(message => {
            addMsg(message.text, message.type, message.image, false);
        });

        renderChatList();

    function updateCurrentChatStorage() {

        const currentChat = chats.find(c => c.id === currentChatId);

        renderChatList();

        const currentChat = chats.find(c => c.id === currentChatId);

        if (!currentChat) {

        currentChat.messages.push({
            type: type,
            text: text,
            image: image
        });

        // MODIFICADO: Si es el primer mensaje del usuario, asigna título corto y luego lanza generación por IA
        if (currentChat.title === "Nuevo chat" && type === "user" && text) {
            currentChat.title = generateChatTitle(text);
            updateCurrentChatStorage();
            // Lanza la generación de título por IA sin bloquear
            generateChatTitleWithAI(text, currentChat.id);
        } else {

    function toggleSidebar(force = null) {

        if (shouldOpen) {
            sidebar.classList.add("active");
            overlay.classList.add("active");
        } else {
            sidebar.classList.remove("active");
            overlay.classList.remove("active");
        }

    }

    function autoResizeTextarea() {

        input.style.height = "48px";

        input.style.height = input.scrollHeight + "px";

        if (input.value.trim() === "") {
            input.style.height = "48px";
            input.scrollTop = 0;
        }

    }

    input.addEventListener('input', () => {

        autoResizeTextarea();

        if (input.value.trim().length > 0) {

            sendButton.classList.add("active");

                sendButton.classList.remove("active");

        if (remaining < 0) {

        return remaining;

    // MODIFICADO: Mayor calidad (0.85) y mayor resolución máxima (1920px) para mejor lectura de imágenes
    async function compressImage(base64, quality = 0.85, maxWidth = 1920) {

        return new Promise((resolve) => {

            const img = new Image();

            img.onload = function() {

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                const canvas = document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(img, 0, 0, width, height);

                const compressed = canvas.toDataURL("image/jpeg", quality);

                resolve(compressed);

            };

            img.src = base64;

        });

    }

    // MODIFICADO: optimizeConversationHistory ahora limpia imágenes base64 de mensajes antiguos
    // para reducir el tamaño del payload y acelerar las respuestas sin perder el contexto textual.
    // Solo el último mensaje con imagen conserva la imagen real; los anteriores se convierten en texto.
    function optimizeConversationHistory() {

        const systemMessage = conversationHistory[0];

        // Tomar solo los últimos 14 mensajes (7 turnos) para reducir tokens
        const recentMessages = conversationHistory.slice(-14);

        // Encontrar el índice del último mensaje que contiene una imagen real
        let lastImageIndex = -1;
        for (let i = recentMessages.length - 1; i >= 0; i--) {
            const msg = recentMessages[i];
            if (Array.isArray(msg.content)) {
                const hasImage = msg.content.some(part => part.type === "image_url");
                if (hasImage) {
                    lastImageIndex = i;
                    break;
                }
            }
        }

        // Procesar mensajes: convertir imágenes antiguas a referencia de texto para reducir payload
        const optimizedMessages = recentMessages.map((msg, idx) => {

            if (!Array.isArray(msg.content)) {

                // Mensaje de texto puro: truncar si es muy largo para reducir tokens
                if (typeof msg.content === "string" && msg.content.length > 1200) {
                    return {
                        ...msg,
                        content: msg.content.substring(0, 1200) + "... [texto truncado para optimización]"
                    };
                }

                return msg;

            }

            // Si este mensaje tiene imagen y NO es el más reciente con imagen, quitar la imagen
            if (idx !== lastImageIndex) {

                const hasImage = msg.content.some(part => part.type === "image_url");

                if (hasImage) {

                    // Reemplazar el bloque de imagen con texto de referencia
                    const textParts = msg.content.filter(part => part.type === "text");
                    const combinedText = textParts.map(p => p.text).join(" ");

                    return {
                        role: msg.role,
                        content: combinedText + " [imagen enviada anteriormente, ya analizada]"
                    };

                }

            }

            // Si es el mensaje con la imagen más reciente, conservarlo completo
            return msg;

        });

        conversationHistory = [
            systemMessage,
            ...optimizedMessages
        ];

    }

    function extractRetrySeconds(errorMessage) {

        const regex = /try again in ([0-9.]+)s/i;

        const match = errorMessage.match(regex);

        if (match && match[1]) {
            return Math.ceil(parseFloat(match[1]));
        }

        return 5;

    }

    function wait(ms) {

        return new Promise(resolve => setTimeout(resolve, ms));

    }

    async function sendRequestWithRetry(requestBody, signal) {

        while (true) {

            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody),
                signal: signal
            });

            if (r.ok) {
                return r;
            }

            let errorText = await r.text();

            try {

                const errorJson = JSON.parse(errorText);

                if (errorJson.error && errorJson.error.message) {

                    const errorMessage = errorJson.error.message;

                    if (errorMessage.toLowerCase().includes("rate limit")) {

                        const seconds = extractRetrySeconds(errorMessage);

                        await wait(seconds * 1000);

                        continue;

                    }

                }

            } catch {

            }

            throw new Error(errorText);

        }

    }

    }

                if (msgWrapper && totalSecondsElapsed >= 0) {

    function cleanResponse(text) {

        if (!text) {
            return "";
        }

        let cleaned = text;

        cleaned = cleaned.replace(/\\\(/g, "");
        cleaned = cleaned.replace(/\\\)/g, "");

        cleaned = cleaned.replace(/\\times/g, "×");
        cleaned = cleaned.replace(/\\text\{([^}]*)\}/g, "$1");

        cleaned = cleaned.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "$1/$2");

        cleaned = cleaned.replace(/\\\\/g, "");

        cleaned = cleaned.replace(/\$/g, "");

        cleaned = cleaned.replace(/```math/g, "```math");
        cleaned = cleaned.replace(/```lua/g, "```lua");
        cleaned = cleaned.replace(/```luau/g, "```luau");
        cleaned = cleaned.replace(/```html/g, "```html");
        cleaned = cleaned.replace(/```css/g, "```css");
        cleaned = cleaned.replace(/```javascript/g, "```javascript");
        cleaned = cleaned.replace(/```js/g, "```js");
        cleaned = cleaned.replace(/```python/g, "```python");

        cleaned = cleaned.replace(/\\,/g, "");

        cleaned = cleaned.replace(/\\=/g, "=");

        cleaned = cleaned.replace(/\\/g, "");

        return cleaned;

    }

    function parseMarkdown(text) {

        if (!text) {
            return "";
        }

        let parsed = escapeHtml(text);

        parsed = parsed.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        parsed = parsed.replace(/^## (.*$)/gim, '<h2>$1</h2>');
        parsed = parsed.replace(/^# (.*$)/gim, '<h1>$1</h1>');

        parsed = parsed.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');

        parsed = parsed.replace(/^\* (.*$)/gim, '<li>$1</li>');
        parsed = parsed.replace(/^\- (.*$)/gim, '<li>$1</li>');

        parsed = parsed.replace(/(<li>.*<\/li>)/gims, '<ul>$1</ul>');

        parsed = parsed.replace(/\n/g, '<br>');

        parsed = parsed.replace(/<\/ul><br><ul>/g, '');

        return parsed;

    }

    function detectLanguage(codeText) {

        const firstLine = codeText.split('\n')[0].trim().toLowerCase();

        const languageList = [
            "html",
            "css",
            "javascript",
            "js",
            "python",
            "lua",
            "luau",
            "java",
            "cpp",
            "csharp",
            "php",
            "json"
        ];

        if (languageList.includes(firstLine)) {
            return firstLine;
        }

        return "código";

    }

    function removeLanguageLine(codeText, language) {

        const lines = codeText.split('\n');

        if (lines[0].trim().toLowerCase() === language.toLowerCase()) {
            lines.shift();
        }

        return lines.join('\n');

    }

    // MODIFICADO: addMsg ahora devuelve el wrapper y tiene soporte para menú contextual en mensajes IA
    function addMsg(t, type, img = null, shouldSave = true) {

        const w = document.createElement('div');

        w.className = `msg-wrapper ${type}-wrapper`;

        if (img) {

            const i = document.createElement('img');

            i.src = img;

            i.className = 'chat-img';

            w.appendChild(i);

        }

        const b = document.createElement('div');

        b.className = `bubble ${type}-bubble`;

        if(t && t.includes('```')) {

            const p = t.split('```');

            b.innerHTML = p.map((c, i) => {

                if (i % 2 === 1) {

                    const detectedLanguage = detectLanguage(c.trim());

                    const cleanCode = removeLanguageLine(c.trim(), detectedLanguage);

                    return `
<div class="code-block-wrapper">
    <div class="code-header">
        <div class="code-language">${escapeHtml(detectedLanguage)}</div>
        <div class="copy-indicator">Mantén presionado para copiar</div>
    </div>
    <pre oncontextmenu="copyCode(event, this)"><code>${escapeHtml(cleanCode)}</code></pre>
</div>`;

                }

                return parseMarkdown(c);

            }).join('');

        } else if (t) {

            b.innerHTML = parseMarkdown(t);

        }

        if (t || img) {

            w.appendChild(b);

            // NUEVO: Menú contextual al mantener presionado en burbujas de IA
            if (type === 'ai') {
                let longPressTimer = null;

                b.addEventListener('touchstart', (e) => {
                    longPressTimer = setTimeout(() => {
                        showContextMenu(e.touches[0].clientX, e.touches[0].clientY, t, w);
                    }, 600);
                }, { passive: true });

                b.addEventListener('touchend', () => {
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                });

                b.addEventListener('touchmove', () => {
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                });

                b.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    showContextMenu(e.clientX, e.clientY, t, w);
                });
            }

            chat.appendChild(w);

            chat.scrollTop = chat.scrollHeight;

        }

        return w;

    }

    }

    // NUEVO: Ocultar menú contextual si se toca fuera
    function hideContextMenuOnClickOutside(e) {

        const menu = document.getElementById('msgContextMenu');

        if (!menu.contains(e.target)) {
            menu.style.display = 'none';
        }

    }

    // NUEVO: Copiar texto del menú contextual
    async function contextMenuCopy() {

        const menu = document.getElementById('msgContextMenu');
        menu.style.display = 'none';

        if (!contextMenuCurrentText) {
            return;
        }

        try {
            await navigator.clipboard.writeText(contextMenuCurrentText);
        } catch (err) {
            const ta = document.createElement("textarea");
            ta.value = contextMenuCurrentText;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
        }

    }

    // NUEVO: Reenviar / pensar de nuevo desde menú contextual
    async function contextMenuRetry() {

        const menu = document.getElementById('msgContextMenu');
        menu.style.display = 'none';

        if (isGeneratingResponse) {
            return;
        }

        // Quitar el último mensaje de IA del historial para que regenere
        if (conversationHistory.length > 1 && conversationHistory[conversationHistory.length - 1].role === "assistant") {
            conversationHistory.pop();
        }

        // Quitar visualmente el wrapper de ese mensaje
        if (contextMenuCurrentWrapper) {
            contextMenuCurrentWrapper.remove();
        }

        responseStopRequested = false;
        currentAbortController = new AbortController();

        saveGeneratingState();

        setGeneratingState(true);

        toggleLoad(true);

        startLoaderTimer();

        try {

            const requestBody = {
                model: "meta-llama/llama-4-scout-17b-16e-instruct",
                messages: conversationHistory,
                temperature: 0.5,
                max_tokens: 8192
            };

            const r = await sendRequestWithRetry(requestBody, currentAbortController.signal);

            const totalSecondsElapsed = clearLoaderTimer();

            toggleLoad(false);

            if (responseStopRequested) {
                return;
            }

            const d = await r.json();

            if(d.choices && d.choices[0] && d.choices[0].message) {

                const aiResponse = cleanResponse(d.choices[0].message.content);

                conversationHistory.push({
                    role: "assistant",
                    content: aiResponse
                });

                optimizeConversationHistory();

                updateCurrentChatStorage();

                const msgWrapper = addMsg(aiResponse, 'ai');
                addMessageToCurrentChat('ai', aiResponse, null);

                if (msgWrapper && totalSecondsElapsed >= 0) {
                    const timerEl = document.createElement('div');
                    timerEl.className = 'response-timer';
                    timerEl.textContent = formatResponseTime(totalSecondsElapsed);
                    msgWrapper.appendChild(timerEl);
                    chat.scrollTop = chat.scrollHeight;
                }

            } else if (d.error) {

                addMsg("Error al regenerar: " + d.error.message, 'ai');

            } else {

                addMsg("Respuesta inesperada del servidor.", 'ai');

            }

        } catch(e) {

            clearLoaderTimer();
            toggleLoad(false);

            if (e.name === 'AbortError' || responseStopRequested) {
                return;
            }

            addMsg("Error de conexión al núcleo: " + e.message, 'ai');

        } finally {

            clearLoaderTimer();
            toggleLoad(false);

            setGeneratingState(false);

            clearGeneratingState();

            currentAbortController = null;

        }

    }

    function escapeHtml(text) {

        if (!text) {
            return "";
        }

        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

    }

    // MODIFICADO: toggleLoad ahora incluye el timer element dentro del loader
    function toggleLoad(s) {

        if(s) {

            const existingLoader = document.getElementById('loader');

            if (existingLoader) {
                existingLoader.remove();
            }

            const l = document.createElement('div');

            l.id = 'loader';

            l.className = 'msg-wrapper ai-wrapper';

            l.innerHTML = '<div class="bubble ai-bubble"><div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div><div class="loader-timer">00:00</div></div>';

            chat.appendChild(l);

            chat.scrollTop = chat.scrollHeight;

        } else {

            const l = document.getElementById('loader');

            if(l) {
                l.remove();
            }

        }

    }

    async function copy(btn) {

        const codeElement = btn.nextElementSibling;

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            btn.innerText = "¡Listo!";

            setTimeout(() => {

                btn.innerText = "Copiar";

            }, 2000);

        } catch (error) {

            const tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            btn.innerText = "¡Listo!";

            setTimeout(() => {

                btn.innerText = "Copiar";

            }, 2000);

        }

    }

    async function copyCode(event, element) {

        event.preventDefault();

        const codeElement = element.querySelector("code");

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            const indicator = element.parentElement.querySelector(".copy-indicator");

            const originalText = indicator.innerText;

            indicator.innerText = "¡Código copiado!";

            setTimeout(() => {

                indicator.innerText = originalText;

            }, 2000);

        } catch (error) {

            const tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            const indicator = element.parentElement.querySelector(".copy-indicator");

            const originalText = indicator.innerText;

            indicator.innerText = "¡Código copiado!";

            setTimeout(() => {

                indicator.innerText = originalText;

            }, 2000);

        }

    }

    input.style.height = "48px";

    loadChats();
</script>
