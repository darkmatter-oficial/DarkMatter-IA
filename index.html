<!DOCTYPE html>            
<html lang="es">            
<head>            
    <meta charset="UTF-8">            
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">            
    <title>DarkMatter Pro AI</title>            
    <style>            
        :root {            
            --bg-color: #14081f;            
            --panel-color: #1e1030;            
            --accent-color: #a855f7;            
            --accent-glow: rgba(168, 85, 247, 0.6);            
            --text-primary: #f8fafc;            
            --text-secondary: #c4b5fd;            
            --user-bubble: linear-gradient(135deg, #9333ea, #6b21a8);            
            --ai-bubble: linear-gradient(135deg, #2e1065, #1e1030);

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }            
            
        body {            
            background-color: var(--bg-color);            
            color: var(--text-primary);            
            font-family: 'Inter', sans-serif;            
            height: 100vh;            
            height: 100dvh;            
            display: flex;            
            flex-direction: column;            
            overflow: hidden;            
            position: fixed;            
            width: 100%;            
        }

            padding: 15px 20px;            
            display: flex;            
            justify-content: space-between;            
            align-items: center;            
            background: rgba(30, 16, 48, 0.92);            
            backdrop-filter: blur(10px);            
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);            
            z-index: 100;            
            flex-shrink: 0;            
            position: relative;            
            animation: slideDown 0.5s ease-out forwards;

        .title-small {

            font-weight: 900;            
            letter-spacing: 3px;            
            color: var(--accent-color);            
            text-shadow: 0 0 10px var(--accent-glow);

            border-radius: 12px;

            flex-direction: column;            
            justify-content: center;            
            align-items: center;            
            gap: 4px;            
            cursor: pointer;            
            margin-right: 12px;            
            flex-shrink: 0;            
            transition: all 0.3s ease;            
        }            
            
        .menu-btn:hover {            
            transform: scale(1.05);            
            border-color: var(--accent-color);

            flex-direction: column;

            from { opacity: 0; transform: translateY(20px) scale(0.98); }            
            to { opacity: 1; transform: translateY(0) scale(1); }            
        }            
            
        @keyframes slideDown {            
            from { opacity: 0; transform: translateY(-20px); }            
            to { opacity: 1; transform: translateY(0); }

        @keyframes slideInLeft {            
            from { opacity: 0; transform: translateX(-20px); }            
            to { opacity: 1; transform: translateX(0); }

            top: 8px;            
            right: 8px;            
            z-index: 999;            
            background: rgba(168, 85, 247, 0.2);

            border-radius: 6px;

            backdrop-filter: blur(5px);

            transition: all 0.3s ease;

        .copy-btn:hover {            
            background: rgba(168, 85, 247, 0.4);

            transform: scale(1.05);            
        }            
            
        .copy-btn:active {            
            transform: scale(0.95);            
        }            
            
        h1, h2, h3, h4, h5, h6 {            
            margin-top: 12px;            
            margin-bottom: 8px;            
            color: #ffffff;            
            animation: slideUp 0.5s ease-out forwards;            
        }            
            
        h1 {            
            font-size: 1.5rem;            
        }            
            
        h2 {            
            font-size: 1.3rem;            
        }            
            
        h3 {            
            font-size: 1.1rem;            
        }            
            
        strong {            
            color: #ffffff;            
            font-weight: bold;            
        }            
            
        ul, ol {            
            padding-left: 20px;            
            margin-top: 8px;            
            margin-bottom: 8px;            
            animation: slideUp 0.5s ease-out forwards;            
        }            
            
        li {            
            margin-bottom: 6px;            
            animation: slideUp 0.5s ease-out forwards;            
        }            
            
        .chat-img {            
            max-width: 200px;            
            border-radius: 12px;            
            margin-bottom: 8px;            
            border: 1px solid rgba(255,255,255,0.1);            
            animation: slideUp 0.4s ease-out forwards;            
            transition: all 0.3s ease;            
        }            
            
        .chat-img:hover {            
            transform: scale(1.05);            
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);            
        }

            display: none;            
            padding: 10px 20px;            
            background: var(--panel-color);            
            border-top: 1px solid rgba(168, 85, 247, 0.25);            
            position: relative;            
            animation: slideUp 0.3s ease-out forwards;            
        }            
            
        #img-preview {

            height: 60px;            
            object-fit: cover;            
            border-radius: 8px;            
            border: 2px solid var(--accent-color);

            transition: all 0.3s ease;            
        }            
            
        #img-preview:hover {            
            transform: scale(1.1);            
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);            
        }            
            
        .close-preview {

            top: 5px;            
            left: 75px;            
            background: #ef4444;            
            color: white;            
            border-radius: 50%;            
            width: 20px;            
            height: 20px;            
            display: flex;            
            align-items: center;            
            justify-content: center;

        .input-area-wrapper {

        .image-cooldown-text {

    async function compressImage(base64, quality = 0.6, maxWidth = 1280) {            
            
        return new Promise((resolve) => {            
            
            const img = new Image();            
            
            img.onload = function() {            
            
                let width = img.width;            
                let height = img.height;            
            
                if (width > maxWidth) {            
                    height = Math.round((height * maxWidth) / width);            
                    width = maxWidth;            
                }            
            
                const canvas = document.createElement("canvas");            
            
                canvas.width = width;            
                canvas.height = height;            
            
                const ctx = canvas.getContext("2d");            
            
                ctx.drawImage(img, 0, 0, width, height);            
            
                const compressed = canvas.toDataURL("image/jpeg", quality);            
            
                resolve(compressed);            
            
            };            
            
            img.src = base64;            
            
        });            
            
    }

    function cleanResponse(text) {            
            
        if (!text) {            
            return "";            
        }            
            
        let cleaned = text;            
            
        cleaned = cleaned.replace(/\\\(/g, "");            
        cleaned = cleaned.replace(/\\\)/g, "");            
            
        cleaned = cleaned.replace(/\\times/g, "×");            
        cleaned = cleaned.replace(/\\text\{([^}]*)\}/g, "$1");            
            
        cleaned = cleaned.replace(/\\frac\{([^}]*)\}\{([^}]*)\}/g, "$1/$2");            
            
        cleaned = cleaned.replace(/\\\\/g, "");            
            
        cleaned = cleaned.replace(/\$/g, "");            
            
        cleaned = cleaned.replace(/```math/g, "```math");            
        cleaned = cleaned.replace(/```lua/g, "```lua");            
        cleaned = cleaned.replace(/```luau/g, "```luau");            
        cleaned = cleaned.replace(/```html/g, "```html");            
        cleaned = cleaned.replace(/```css/g, "```css");            
        cleaned = cleaned.replace(/```javascript/g, "```javascript");            
        cleaned = cleaned.replace(/```js/g, "```js");            
        cleaned = cleaned.replace(/```python/g, "```python");            
            
        cleaned = cleaned.replace(/\\,/g, "");            
            
        cleaned = cleaned.replace(/\\=/g, "=");            
            
        cleaned = cleaned.replace(/\\/g, "");            
            
        return cleaned;            
            
    }            
            
    function parseMarkdown(text) {            
            
        if (!text) {            
            return "";            
        }            
            
        let parsed = escapeHtml(text);            
            
        parsed = parsed.replace(/^### (.*$)/gim, '<h3>$1</h3>');            
        parsed = parsed.replace(/^## (.*$)/gim, '<h2>$1</h2>');            
        parsed = parsed.replace(/^# (.*$)/gim, '<h1>$1</h1>');            
            
        parsed = parsed.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');            
            
        parsed = parsed.replace(/^\* (.*$)/gim, '<li>$1</li>');            
        parsed = parsed.replace(/^\- (.*$)/gim, '<li>$1</li>');            
            
        parsed = parsed.replace(/(<li>.*<\/li>)/gims, '<ul>$1</ul>');            
            
        parsed = parsed.replace(/\n/g, '<br>');            
            
        parsed = parsed.replace(/<\/ul><br><ul>/g, '');            
            
        return parsed;            
            
    }            
            
    function detectLanguage(codeText) {            
            
        const firstLine = codeText.split('\n')[0].trim().toLowerCase();            
            
        const languageList = [            
            "html",            
            "css",            
            "javascript",            
            "js",            
            "python",            
            "lua",            
            "luau",            
            "java",            
            "cpp",            
            "csharp",            
            "php",            
            "json"            
        ];            
            
        if (languageList.includes(firstLine)) {            
            return firstLine;            
        }            
            
        return "código";            
            
    }            
            
    function removeLanguageLine(codeText, language) {            
            
        const lines = codeText.split('\n');            
            
        if (lines[0].trim().toLowerCase() === language.toLowerCase()) {            
            lines.shift();            
        }            
            
        return lines.join('\n');            
            
    }

    function escapeHtml(text) {            
            
        if (!text) {            
            return "";            
        }            
            
        return text            
            .replace(/&/g, "&amp;")            
            .replace(/</g, "&lt;")            
            .replace(/>/g, "&gt;");            
            
    }            
            
    function toggleLoad(s) {            
            
        if(s) {            
            
            const existingLoader = document.getElementById('loader');            
            
            if (existingLoader) {            
                existingLoader.remove();            
            }            
            
            const l = document.createElement('div');            
            
            l.id = 'loader';            
            
            l.className = 'msg-wrapper ai-wrapper';            
            
            l.innerHTML = '<div class="bubble ai-bubble dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';            
            
            chat.appendChild(l);            
            
            chat.scrollTop = chat.scrollHeight;            
            
        } else {            
            
            const l = document.getElementById('loader');            
            
            if(l) {            
                l.remove();            
            }            
            
        }            
            
    }            
            
    async function copy(btn) {            
            
        const codeElement = btn.nextElementSibling;            
            
        try {            
            
            await navigator.clipboard.writeText(codeElement.innerText);            
            
            btn.innerText = "¡Listo!";            
            
            setTimeout(() => {            
            
                btn.innerText = "Copiar";            
            
            }, 2000);            
            
        } catch (error) {            
            
            const tempTextArea = document.createElement("textarea");            
            
            tempTextArea.value = codeElement.innerText;            
            
            document.body.appendChild(tempTextArea);            
            
            tempTextArea.select();            
            
            document.execCommand("copy");            
            
            document.body.removeChild(tempTextArea);            
            
            btn.innerText = "¡Listo!";            
            
            setTimeout(() => {            
            
                btn.innerText = "Copiar";            
            
            }, 2000);            
            
        }            
            
    }            
            
    async function copyCode(event, element) {            
            
        event.preventDefault();            
            
        const codeElement = element.querySelector("code");            
            
        try {            
            
            await navigator.clipboard.writeText(codeElement.innerText);            
            
            const indicator = element.parentElement.querySelector(".copy-indicator");            
            
            const originalText = indicator.innerText;            
            
            indicator.innerText = "¡Código copiado!";            
            
            setTimeout(() => {            
            
                indicator.innerText = originalText;            
            
            }, 2000);            
            
        } catch (error) {            
            
            const tempTextArea = document.createElement("textarea");            
            
            tempTextArea.value = codeElement.innerText;            
            
            document.body.appendChild(tempTextArea);            
            
            tempTextArea.select();            
            
            document.execCommand("copy");            
            
            document.body.removeChild(tempTextArea);            
            
            const indicator = element.parentElement.querySelector(".copy-indicator");            
            
            const originalText = indicator.innerText;            
            
            indicator.innerText = "¡Código copiado!";            
            
            setTimeout(() => {            
            
                indicator.innerText = originalText;            
            
            }, 2000);            
            
        }            
            
    }            
            
    input.style.height = "48px";            
            
    loadChats();            
</script>
