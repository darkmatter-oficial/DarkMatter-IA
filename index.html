<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DarkMatter Pro AI</title>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
    <style>
        :root {
            --bg-color: #14081f;
            --panel-color: #1e1030;
            --accent-color: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.6);
            --text-primary: #f8fafc;
            --text-secondary: #c4b5fd;
            --user-bubble: linear-gradient(135deg, #9333ea, #6b21a8);
            --ai-bubble: linear-gradient(135deg, #2e1065, #1e1030);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 16, 48, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            z-index: 100;
            flex-shrink: 0;
            position: relative;
            animation: slideDown 0.5s ease-out forwards;
        }

        .title-small {
            font-size: 0.7rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--accent-color);
            text-shadow: 0 0 10px var(--accent-glow);
            animation: glowPulse 2s ease-in-out infinite;
        }

        .status { font-size: 0.6rem; color: #c084fc; text-transform: uppercase; letter-spacing: 1px; animation: blink 2s ease-in-out infinite; }

        .menu-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.25);
            background: rgba(20, 8, 31, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            margin-right: 12px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            transform: scale(1.05);
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.3);
        }

        .menu-btn span {
            width: 18px;
            height: 2px;
            border-radius: 999px;
            background: white;
            transition: all 0.3s ease;
        }

        .menu-btn:active span:nth-child(1) {
            transform: rotate(-45deg) translateY(10px);
        }

        .menu-btn:active span:nth-child(2) {
            opacity: 0;
        }

        .menu-btn:active span:nth-child(3) {
            transform: rotate(45deg) translateY(-10px);
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        #sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
        }

        #sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        #sidebar {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: #1a0c2a;
            z-index: 1000;
            border-right: 1px solid rgba(168, 85, 247, 0.25);
            transition: 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #sidebar.active {
            left: 0;
            animation: slideInLeft 0.3s ease-out forwards;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid rgba(168, 85, 247, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .sidebar-title {
            font-size: 0.9rem;
            font-weight: bold;
            color: white;
        }

        .new-chat-btn {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-chat-btn:hover {
            background: #a855f7;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .new-chat-btn:active {
            transform: scale(0.95);
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-item {
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 14px;
            padding: 12px;
            cursor: pointer;
            transition: 0.2s;
            animation: slideInLeft 0.4s ease-out forwards;
            position: relative;
        }

        .chat-item:hover {
            background: rgba(168, 85, 247, 0.16);
            transform: translateX(5px);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.2);
        }

        .chat-item.active {
            border-color: #a855f7;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.3);
            animation: glow 1.5s ease-in-out infinite;
        }

        .chat-item-title {
            font-size: 0.82rem;
            color: white;
            font-weight: bold;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            padding-right: 28px;
        }

        .chat-item-preview {
            font-size: 0.7rem;
            color: #d8b4fe;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-delete-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: rgba(196, 181, 253, 0.35);
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: all 0.2s ease;
            line-height: 1;
        }

        .chat-delete-btn:hover {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.12);
            transform: scale(1.15);
        }

        .chat-delete-btn svg {
            width: 13px;
            height: 13px;
        }

        .confirm-delete-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.65);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.2s ease-out forwards;
        }

        .confirm-delete-box {
            background: #1a0c2a;
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 20px;
            padding: 28px 24px 20px 24px;
            max-width: 300px;
            width: 90%;
            display: flex;
            flex-direction: column;
            gap: 14px;
            animation: slideUp 0.3s ease-out forwards;
            text-align: center;
        }

        .confirm-delete-title {
            font-size: 0.85rem;
            font-weight: bold;
            color: #ef4444;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .confirm-delete-msg {
            font-size: 0.82rem;
            color: #d8b4fe;
            line-height: 1.5;
        }

        .confirm-delete-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .confirm-delete-cancel {
            background: rgba(168, 85, 247, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.25);
            color: #c4b5fd;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .confirm-delete-cancel:hover {
            background: rgba(168, 85, 247, 0.2);
        }

        .confirm-delete-confirm {
            background: #dc2626;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .confirm-delete-confirm:hover {
            background: #ef4444;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
        }

        #chat-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 10px var(--accent-glow); }
            50% { text-shadow: 0 0 20px var(--accent-glow), 0 0 30px rgba(168, 85, 247, 0.8); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 12px rgba(168, 85, 247, 0.3); }
            50% { box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes formulaPulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.03); }
        }

        @keyframes formulaSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .formula-loading-placeholder {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(168, 85, 247, 0.10);
            border: 1px solid rgba(168, 85, 247, 0.30);
            border-radius: 10px;
            padding: 5px 13px;
            margin: 3px 2px;
            vertical-align: middle;
            animation: formulaPulse 1.2s ease-in-out infinite;
        }

        .formula-loading-placeholder .formula-spinner {
            width: 13px;
            height: 13px;
            border: 2px solid rgba(168, 85, 247, 0.25);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: formulaSpin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .formula-loading-placeholder .formula-loading-text {
            font-size: 0.72rem;
            color: #c4b5fd;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .formula-loading-block {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 12px;
            padding: 12px 18px;
            margin: 10px 0;
            animation: formulaPulse 1.2s ease-in-out infinite;
        }

        .formula-loading-block .formula-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(168, 85, 247, 0.2);
            border-top-color: #a855f7;
            border-radius: 50%;
            animation: formulaSpin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .formula-loading-block .formula-loading-text {
            font-size: 0.78rem;
            color: #c4b5fd;
            letter-spacing: 0.5px;
        }

        .msg-wrapper { max-width: 90%; display: flex; animation: slideUp 0.4s ease-out forwards; flex-direction: column; }
        .user-wrapper { align-self: flex-end; }
        .ai-wrapper { align-self: flex-start; }

        .bubble {
            padding: 14px 18px;
            border-radius: 22px;
            font-size: 0.9rem;
            line-height: 1.7;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
            transition: all 0.3s ease;
        }

        .bubble:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.35);
        }

        .user-bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; animation: slideUp 0.5s ease-out forwards; }
        .ai-bubble { background: var(--ai-bubble); border: 1px solid rgba(168, 85, 247, 0.15); border-bottom-left-radius: 4px; animation: slideUp 0.5s ease-out forwards; }

        .ai-bubble.dots {
            display: inline-flex;
            width: auto;
            padding: 14px 20px;
        }

        .MathJax {
            color: #f0e6ff;
            font-size: 1em;
        }

        .MathJax_Display {
            margin: 10px 0;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .math-display-wrapper {
            display: block;
            width: 100%;
            text-align: center;
            margin: 16px 0;
            padding: 14px 10px;
            overflow-x: auto;
            overflow-y: hidden;
            line-height: 1;
        }

        .math-display-wrapper mjx-container,
        .math-display-wrapper .MathJax {
            font-size: 1.1em !important;
        }

        .math-inline-wrapper {
            display: inline;
            margin: 0 1px;
        }

        .ai-bubble p {
            margin: 0 0 10px 0;
            line-height: 1.7;
        }

        .ai-bubble p:last-child {
            margin-bottom: 0;
        }

        .ai-bubble mjx-container[display="true"] {
            display: block !important;
            margin: 16px auto !important;
            text-align: center !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            padding: 10px 0 !important;
        }

        .ai-bubble mjx-container[display="false"] {
            display: inline !important;
            margin: 0 2px !important;
        }

        .ai-bubble ul {
            padding-left: 22px;
            margin: 10px 0;
            list-style-type: disc;
        }

        .ai-bubble ol {
            padding-left: 22px;
            margin: 10px 0;
            list-style-type: decimal;
        }

        .ai-bubble li {
            margin-bottom: 6px;
            line-height: 1.7;
        }

        .ai-bubble li.formula-only-li {
            list-style: none;
            margin-left: -22px;
            text-align: center;
            margin-bottom: 4px;
        }

        .ai-bubble table {
            border-collapse: collapse;
            width: 100%;
            margin: 14px 0;
            font-size: 0.85rem;
            overflow-x: auto;
            display: block;
        }

        .ai-bubble table th {
            background: rgba(168, 85, 247, 0.25);
            color: #e9d5ff;
            padding: 8px 12px;
            text-align: left;
            border: 1px solid rgba(168, 85, 247, 0.3);
            font-weight: 700;
            white-space: nowrap;
        }

        .ai-bubble table td {
            padding: 7px 12px;
            border: 1px solid rgba(168, 85, 247, 0.18);
            color: #f0e6ff;
            vertical-align: top;
        }

        .ai-bubble table tr:nth-child(even) td {
            background: rgba(168, 85, 247, 0.06);
        }

        .ai-bubble table tr:hover td {
            background: rgba(168, 85, 247, 0.12);
        }

        .code-block-wrapper {
            margin: 12px 0;
            border-radius: 12px;
            overflow: hidden;
            border-left: 3px solid var(--accent-color);
            background: #12061d;
            animation: slideUp 0.5s ease-out forwards;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .code-block-wrapper:hover {
            border-left-color: #d8b4fe;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.2);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #1e1030;
            border-bottom: 1px solid rgba(168, 85, 247, 0.25);
            animation: fadeIn 0.4s ease-out forwards;
            width: 100%;
            flex-shrink: 0;
            order: -1;
        }

        .code-language {
            color: var(--accent-color);
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(168, 85, 247, 0.12);
            padding: 3px 10px;
            border-radius: 6px;
            border: 1px solid rgba(168, 85, 247, 0.22);
            animation: fadeIn 0.5s ease-out forwards;
        }

        .copy-indicator {
            color: #d8b4fe;
            font-size: 0.7rem;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .code-copy-btn {
            background: rgba(168, 85, 247, 0.1);
            color: #c4b5fd;
            border: 1px solid rgba(168, 85, 247, 0.28);
            padding: 4px 13px;
            border-radius: 6px;
            font-size: 0.67rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.4px;
            white-space: nowrap;
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .code-copy-btn:hover {
            background: rgba(168, 85, 247, 0.28);
            color: white;
            box-shadow: 0 0 8px rgba(168, 85, 247, 0.3);
        }

        .code-copy-btn:active {
            transform: scale(0.94);
        }

        pre {
            background: #12061d;
            margin: 0;
            padding: 15px;
            border-radius: 0;
            font-family: monospace;
            font-size: 0.8rem;
            overflow-x: auto;
            overflow-y: hidden;
            position: relative;
            color: #e9d5ff;
            -webkit-user-select: text;
            user-select: text;
            animation: fadeIn 0.6s ease-out forwards;
            flex: 1;
        }

        pre code {
            display: block;
            min-width: max-content;
            white-space: pre;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 999;
            background: rgba(168, 85, 247, 0.2);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 6px 10px;
            font-size: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transform: translateX(0px);
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        .copy-btn:hover {
            background: rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
            transform: scale(1.05);
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .ai-bubble h1, .ai-bubble h2, .ai-bubble h3,
        .ai-bubble h4, .ai-bubble h5, .ai-bubble h6 {
            margin-top: 18px;
            margin-bottom: 8px;
            color: #ffffff;
            font-weight: 700;
            line-height: 1.3;
        }

        .ai-bubble h1 { font-size: 1.4rem; border-bottom: 1px solid rgba(168,85,247,0.2); padding-bottom: 6px; }
        .ai-bubble h2 { font-size: 1.2rem; }
        .ai-bubble h3 { font-size: 1.05rem; color: #e9d5ff; }

        h1, h2, h3, h4, h5, h6 {
            margin-top: 12px;
            margin-bottom: 8px;
            color: #ffffff;
            animation: slideUp 0.5s ease-out forwards;
        }

        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.3rem; }
        h3 { font-size: 1.1rem; }

        strong {
            color: #ffffff;
            font-weight: bold;
        }

        ul, ol {
            padding-left: 20px;
            margin-top: 8px;
            margin-bottom: 8px;
            animation: slideUp 0.5s ease-out forwards;
        }

        li {
            margin-bottom: 6px;
            animation: slideUp 0.5s ease-out forwards;
        }

        .chat-img {
            max-width: 200px;
            border-radius: 12px;
            margin-bottom: 6px;
            border: 1px solid rgba(255,255,255,0.1);
            animation: slideUp 0.4s ease-out forwards;
            transition: all 0.3s ease;
            display: block;
            margin-left: auto;
            margin-right: 0;
        }

        .chat-img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        #preview-container {
            display: none;
            padding: 10px 20px;
            background: var(--panel-color);
            border-top: 1px solid rgba(168, 85, 247, 0.25);
            position: relative;
            animation: slideUp 0.3s ease-out forwards;
        }

        #img-preview {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--accent-color);
            animation: slideUp 0.3s ease-out forwards;
            transition: all 0.3s ease;
        }

        #img-preview:hover {
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
        }

        .close-preview {
            position: absolute;
            top: 5px;
            left: 75px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-preview:hover {
            background: #dc2626;
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
        }

        .input-area-wrapper {
            background: var(--panel-color);
            border-top: 1px solid rgba(168, 85, 247, 0.15);
            border-bottom: 1px solid rgba(168, 85, 247, 0.15);
            padding: 10px 14px;
            padding-bottom: calc(env(safe-area-inset-bottom, 10px) + 10px);
            display: flex;
            flex-direction: column;
            gap: 0px;
            flex-shrink: 0;
            position: relative;
            animation: slideUp 0.5s ease-out forwards;
        }

        .image-cooldown-text {
            display: none;
        }

        .mode-selector {
            display: flex;
            gap: 6px;
            padding: 6px 0px 8px 0px;
            align-items: center;
            justify-content: flex-start;
            flex-wrap: nowrap;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            width: 100%;

REGLA CRÍTICA SOBRE FORMATO MATEMÁTICO — LEE CON ATENCIÓN MÁXIMA:
SIEMPRE que escribas fórmulas, expresiones matemáticas, fracciones, exponentes, raíces, integrales, sumatorias, límites, derivadas, o cualquier símbolo matemático, DEBES usar formato LaTeX con delimitadores correctos. NUNCA escribas matemáticas en texto plano.

REGLAS DE FORMATO MATEMÁTICO ESTILO CHATGPT — CRÍTICO:
1. Fórmulas IMPORTANTES (definiciones, fórmulas principales, resultados clave) → usa bloques $$ ... $$ centrados y destacados. Estas deben aparecer solas en su línea, con una línea en blanco ANTES y DESPUÉS de la fórmula.
2. Fórmulas de RESOLUCIÓN o pasos intermedios → usa $$ ... $$ también, con una línea en blanco antes y después.
3. Variables y expresiones CORTAS dentro del texto → usa $ ... $ inline, integradas naturalmente en la oración.
4. NUNCA cortes una fórmula en múltiples líneas con saltos de párrafo intermedios. Una fórmula va COMPLETA en un solo bloque $$ ... $$.
5. NUNCA escribas matemáticas sin delimitadores LaTeX.
6. NUNCA pongas un punto "." después de una fórmula en bloque $$...$$. Los puntos van solo al final de oraciones de texto, nunca después de fórmulas.
7. NUNCA pongas un bullet "•" o "- " inmediatamente antes de una fórmula $$ ... $$. Si quieres presentar una fórmula como un punto de una lista, escribe primero el texto descriptivo en el bullet y luego la fórmula en su propio bloque $$ fuera de la lista.
8. NUNCA pongas texto suelto como "dB." o "m/s" o cualquier unidad en una línea separada debajo de una fórmula. Si la fórmula incluye unidades, ponlas DENTRO de la fórmula con \\text{dB} o similar.
9. Cuando una resolución encadena pasos como β = 10log(10⁵) = 10×5 = 50 dB, todo ese encadenamiento va en UN SOLO bloque $$ sin dividirlo.
10. El texto explicativo va ANTES de la fórmula, no después en línea separada.

EJEMPLOS CORRECTOS DE FORMATO:
- Texto: "La fórmula del nivel de intensidad sonora es:"
  (línea en blanco)
  $$\\beta = 10 \\log\\left(\\frac{I}{I_0}\\right)$$
  (línea en blanco)
  Texto: "donde $I_0 = 10^{-12} \\, \\text{W/m}^2$ es la intensidad de referencia."

- Texto: "Sustituyendo los valores:"
  (línea en blanco)
  $$\\beta = 10 \\log\\left(\\frac{10^{-7}}{10^{-12}}\\right) = 10 \\log(10^5) = 10 \\times 5 = 50 \\, \\text{dB}$$

EJEMPLOS INCORRECTOS (NUNCA HACER ESTO):
- "• $$\\beta = 10 \\log(I/I_0)$$" ← bullet antes de fórmula en bloque: MAL
- "$$formula$$\\ndB." ← punto o unidad debajo de fórmula: MAL
- "$$formula$$\\n\\n, donde..." ← coma al inicio después de fórmula: MAL

    function getSystemPrompt() {
        return {
            role: "system",
            content: buildSystemPromptContent()
        };
    }

    const systemPrompt = getSystemPrompt();

    let conversationHistory = [systemPrompt];

    let chats = [];
    let currentChatId = null;

    function generateChatId() {
        return "chat_" + Date.now() + "_" + Math.floor(Math.random() * 999999);
    }

    function generateChatTitle(text) {

        if (!text || text.trim() === "") {
            return "Nuevo chat";
        }

        let clean = text.trim();

        if (clean.length > 32) {
            clean = clean.substring(0, 32) + "...";
        }

        return clean;

    }

    async function generateAiChatTitle(userText) {

        try {

            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-4-scout-17b-16e-instruct",
                    messages: [
                        {
                            role: "system",
                            content: "Eres un asistente que genera títulos muy cortos para conversaciones. Dado el primer mensaje del usuario, genera un título de máximo 5 palabras que resuma el tema. Responde SOLO con el título, sin comillas, sin puntos, sin explicaciones adicionales."
                        },
                        {
                            role: "user",
                            content: userText
                        }
                    ],
                    temperature: 0.5,
                    max_tokens: 20
                })
            });

            if (r.ok) {

                const d = await r.json();

                if (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) {

                    let title = d.choices[0].message.content.trim();

                    title = title.replace(/^["']|["']$/g, '');

                    if (title.length > 40) {
                        title = title.substring(0, 40) + "...";
                    }

                    return title;

                }

            }

        } catch (e) {

        }

        return generateChatTitle(userText);

    }

    function stripImagesFromMessages(messages) {
        return messages.map(function(msg) {
            if (msg.image && typeof msg.image === 'string' && msg.image.startsWith('data:')) {
                return {
                    type: msg.type,
                    text: msg.text,
                    image: null,
                    hadImage: true
                };
            }
            return {
                type: msg.type,
                text: msg.text,
                image: msg.image || null,
                hadImage: msg.hadImage || false
            };
        });
    }

    function stripImagesFromHistory(history) {
        return history.map(function(msg) {
            if (Array.isArray(msg.content)) {
                const textParts = msg.content.filter(function(part) {
                    return part.type === 'text';
                });
                const combinedText = textParts.map(function(p) { return p.text; }).join(' ');
                return {
                    role: msg.role,
                    content: combinedText + (msg.content.some(function(p) { return p.type === 'image_url'; }) ? ' [imagen adjunta]' : '')
                };
            }
            return msg;
        });
    }

    function safeLocalStorageSet(key, value) {
        let attempts = 0;
        const MAX_ATTEMPTS = 5;

        while (attempts < MAX_ATTEMPTS) {
            try {
                localStorage.setItem(key, value);
                return true;
            } catch (e) {
                attempts++;

                if (e.name === 'QuotaExceededError' || (e.message && e.message.toLowerCase().includes('quota'))) {

                    if (key === 'darkmatter_saved_chats') {
                        try {
                            const existingRaw = localStorage.getItem('darkmatter_saved_chats');
                            if (existingRaw) {
                                const existingChats = JSON.parse(existingRaw);
                                if (existingChats.length > 1) {
                                    existingChats.pop();
                                    localStorage.setItem('darkmatter_saved_chats', JSON.stringify(existingChats));
                                } else if (existingChats.length === 1) {
                                    localStorage.removeItem('darkmatter_saved_chats');
                                    break;
                                } else {
                                    break;
                                }
                            } else {
                                break;
                            }
                        } catch (innerErr) {
                            break;
                        }
                    } else {
                        try {
                            const keysToTry = [];
                            for (let i = 0; i < localStorage.length; i++) {
                                const k = localStorage.key(i);
                                if (k && k !== 'darkmatter_last_image_time' && k !== 'darkmatter_generating_response' && k !== key) {
                                    keysToTry.push(k);
                                }
                            }
                            if (keysToTry.length > 0) {
                                localStorage.removeItem(keysToTry[0]);
                            } else {
                                break;
                            }
                        } catch (innerErr2) {
                            break;
                        }
                    }

                } else {
                    break;
                }
            }
        }

        return false;
    }

    function saveChats() {

        const chatsToSave = chats.filter(c => c.hasRealConversation === true);

        const chatsStripped = chatsToSave.map(function(c) {
            return {
                id: c.id,
                title: c.title,
                hasRealConversation: c.hasRealConversation,
                messages: stripImagesFromMessages(c.messages),
                history: stripImagesFromHistory(c.history)
            };
        });

        safeLocalStorageSet("darkmatter_saved_chats", JSON.stringify(chatsStripped));

    }

    function loadChats() {

        const savedChats = localStorage.getItem("darkmatter_saved_chats");

        if (savedChats) {
            try {
                const parsed = JSON.parse(savedChats);
                chats = parsed.map(c => ({ ...c, hasRealConversation: true }));
            } catch (e) {
                chats = [];
            }
        }

        createNewChat();

        renderChatList();

    }

    function createNewChat() {

        const newChat = {
            id: generateChatId(),
            title: "Nuevo chat",
            hasRealConversation: false,
            messages: [
                {
                    type: "ai",
                    text: "Nucleo DarkMatter iniciado. Ahora puedo procesar imagenes y guias. Esperando instrucciones...",
                    image: null
                }
            ],
            history: [getSystemPrompt()]
        };

        chats.unshift(newChat);

        currentChatId = newChat.id;

        saveChats();

        openChat(newChat.id);

        renderChatList();

    }

    function confirmDeleteChat(chatId, event) {
        event.stopPropagation();

        const overlay = document.createElement('div');
        overlay.className = 'confirm-delete-overlay';

        const box = document.createElement('div');
        box.className = 'confirm-delete-box';

        const title = document.createElement('div');
        title.className = 'confirm-delete-title';
        title.textContent = 'Eliminar chat';

        const msg = document.createElement('div');
        msg.className = 'confirm-delete-msg';
        msg.textContent = '¿Estás seguro de que quieres eliminar este chat? Esta acción no se puede deshacer.';

        const actions = document.createElement('div');
        actions.className = 'confirm-delete-actions';

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'confirm-delete-cancel';
        cancelBtn.textContent = 'Cancelar';
        cancelBtn.onclick = function() {
            document.body.removeChild(overlay);
        };

        const confirmBtn = document.createElement('button');
        confirmBtn.className = 'confirm-delete-confirm';
        confirmBtn.textContent = 'Eliminar';
        confirmBtn.onclick = function() {
            document.body.removeChild(overlay);
            deleteChat(chatId);
        };

        actions.appendChild(cancelBtn);
        actions.appendChild(confirmBtn);

        box.appendChild(title);
        box.appendChild(msg);
        box.appendChild(actions);

        overlay.appendChild(box);
        document.body.appendChild(overlay);

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                document.body.removeChild(overlay);
            }
        });
    }

    function deleteChat(chatId) {
        const idx = chats.findIndex(c => c.id === chatId);
        if (idx === -1) return;

        chats.splice(idx, 1);

        if (currentChatId === chatId) {
            if (chats.length > 0) {
                currentChatId = chats[0].id;
                openChat(currentChatId);
            } else {
                createNewChat();
                return;
            }
        }

        saveChats();
        renderChatList();
    }

    function renderChatList() {

        const chatList = document.getElementById("chat-list");

        chatList.innerHTML = "";

        chats.forEach(chatData => {

            if (!chatData.hasRealConversation && chatData.id !== currentChatId) {
                return;
            }

            const item = document.createElement("div");

            item.className = "chat-item";

            if (chatData.id === currentChatId) {
                item.classList.add("active");
            }

            item.onclick = () => {
                openChat(chatData.id);
                toggleSidebar(false);
            };

            const previewText = chatData.messages.length > 0
                ? chatData.messages[chatData.messages.length - 1].text
                : "Sin mensajes";

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'chat-delete-btn';
            deleteBtn.title = 'Eliminar chat';
            deleteBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>`;
            deleteBtn.onclick = function(e) {
                confirmDeleteChat(chatData.id, e);
            };

            item.innerHTML = `
                <div class="chat-item-title">${escapeHtml(chatData.title)}</div>
                <div class="chat-item-preview">${escapeHtml(previewText || "Sin mensajes")}</div>
            `;

            item.appendChild(deleteBtn);

            chatList.appendChild(item);

        });

    }

    function openChat(chatId) {

        const selectedChat = chats.find(c => c.id === chatId);

        if (!selectedChat) {
            return;
        }

        currentChatId = chatId;

        conversationHistory = selectedChat.history;

        if (!conversationHistory || conversationHistory.length === 0) {
            conversationHistory = [getSystemPrompt()];
        }

        if (conversationHistory.length > 0 && conversationHistory[0].role === 'system') {
            conversationHistory[0] = getSystemPrompt();
        }

        chat.innerHTML = "";

        selectedChat.messages.forEach(message => {
            addMsg(message.text, message.type, message.image, false);
        });

        renderChatList();

        saveChats();

    }

    function updateCurrentChatStorage() {

        const currentChat = chats.find(c => c.id === currentChatId);

        if (!currentChat) {
            return;
        }

        currentChat.history = conversationHistory;

        saveChats();

        renderChatList();

    }

    async function addMessageToCurrentChat(type, text, image = null, aiResponseReceived = false) {

        const currentChat = chats.find(c => c.id === currentChatId);

        if (!currentChat) {
            return;
        }

        currentChat.messages.push({
            type: type,
            text: text,
            image: image
        });

        if (aiResponseReceived && type === 'ai') {
            currentChat.hasRealConversation = true;
        }

        if (currentChat.hasRealConversation && currentChat.title === "Nuevo chat") {

            const firstUserMsg = currentChat.messages.find(m => m.type === 'user' && m.text);

            if (firstUserMsg) {

                const aiTitle = await generateAiChatTitle(firstUserMsg.text);

                currentChat.title = aiTitle;

            }

        }

        updateCurrentChatStorage();

    }

    function toggleSidebar(force = null) {

        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("sidebar-overlay");

        let shouldOpen = force;

        if (force === null) {
            shouldOpen = !sidebar.classList.contains("active");
        }

        if (shouldOpen) {
            sidebar.classList.add("active");
            overlay.classList.add("active");
        } else {
            sidebar.classList.remove("active");
            overlay.classList.remove("active");
        }

        currentMode = mode;

        }

    // CORREGIDO: optimizeConversationHistory ahora garantiza que el último mensaje del usuario siempre se incluya
    function optimizeConversationHistory() {

        if (!conversationHistory || conversationHistory.length === 0) {
            conversationHistory = [getSystemPrompt()];
            return;
        }

        const systemMessage = conversationHistory[0];
        const nonSystemMessages = conversationHistory.slice(1);
        const messageCount = nonSystemMessages.length;

        // Si hay pocos mensajes, no recortar nada
        if (messageCount <= 10) {
            return;
        }

        // Con muchos mensajes, conservar los más recientes pero siempre al menos 10
        let keepCount = 10;
        if (messageCount > 30) {
            keepCount = 16;
        } else if (messageCount > 20) {
            keepCount = 12;
        }

        const recentMessages = nonSystemMessages.slice(-keepCount);

        conversationHistory = [systemMessage, ...recentMessages];

    }

    function buildRequestMessages() {

        var config = MODE_CONFIGS[currentMode] || MODE_CONFIGS.normal;

        var messages = conversationHistory.slice();

        if (!messages || messages.length === 0) {
            messages = [getSystemPrompt()];
        }

        if (messages.length > 0 && messages[0].role === 'system') {
            messages[0] = getSystemPrompt();
        } else {
            messages = [getSystemPrompt(), ...messages];
        }

        if (config.systemSuffix && config.systemSuffix.length > 0) {
            messages[0] = { role: 'system', content: messages[0].content + config.systemSuffix };
        }

        return messages;

    }

    function getImageCooldownRemaining() {

        const imagesSent = getImagesSentCount();

        if (imagesSent < IMAGE_COOLDOWN_THRESHOLD) {
            return 0;
        }

        if (imageSentTimestamp !== null) {
            const elapsed = Date.now() - imageSentTimestamp;
            const remaining = IMAGE_COOLDOWN_TIME - elapsed;
            if (remaining > 0) {
                return remaining;
            } else {
                imageSentTimestamp = null;
                return 0;
            }
        }

        const savedTime = localStorage.getItem("darkmatter_last_image_time");

        if (!savedTime) {
            return 0;
        }

        const elapsed = Date.now() - parseInt(savedTime);

        const remaining = IMAGE_COOLDOWN_TIME - elapsed;

        if (remaining < 0) {
            return 0;
        }

        return remaining;

    }

    function formatCooldownTime(ms) {
        const totalSeconds = Math.ceil(ms / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        return String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    }

    async function compressImage(base64, quality = 0.75, maxWidth = 1024) {

        return new Promise((resolve) => {

            const img = new Image();

            img.onload = function() {

                let width = img.width;
                let height = img.height;

                if (width > maxWidth) {
                    height = Math.round((height * maxWidth) / width);
                    width = maxWidth;
                }

                const canvas = document.createElement("canvas");

                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");

                ctx.drawImage(img, 0, 0, width, height);

                const compressed = canvas.toDataURL("image/jpeg", quality);

                resolve(compressed);

            };

            img.src = base64;

        });

    }

    function extractRetrySeconds(errorMessage) {

        const regex = /try again in ([0-9.]+)s/i;

        const match = errorMessage.match(regex);

        if (match && match[1]) {
            return Math.ceil(parseFloat(match[1]));
        }

        return 5;

    }

    function wait(ms) {

        return new Promise(resolve => setTimeout(resolve, ms));

    }

    async function sendRequestWithRetry(requestBody, signal) {

        let retryCount = 0;
        const MAX_RETRIES = 3;

        while (retryCount < MAX_RETRIES) {

            const r = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(requestBody),
                signal: signal
            });

            if (r.ok) {
                return r;
            }

            let errorText = await r.text();

            try {

                const errorJson = JSON.parse(errorText);

                if (errorJson.error && errorJson.error.message) {

                    const errorMessage = errorJson.error.message;

                    if (errorMessage.toLowerCase().includes("rate limit")) {

                        const seconds = extractRetrySeconds(errorMessage);

                        await wait(seconds * 1000);

                        retryCount++;

                        continue;

                    }

                }

            } catch (parseErr) {

            }

            throw new Error(errorText);

        }

        throw new Error("Demasiados intentos fallidos. Por favor espera un momento e intenta de nuevo.");

    }

    function extractLatexBlocks(text) {
        const blocks = [];
        let result = text;

        result = result.replace(/\\\[([\s\S]*?)\\\]/g, function(match, inner) {
            return '$$' + inner + '$$';
        });
        result = result.replace(/\\\(([\s\S]*?)\\\)/g, function(match, inner) {
            return '$' + inner + '$';
        });

        result = result.split('\n').map(function(line) {
            if (/\$/.test(line)) return line;

            const hasLatexCommands = /\\(frac|sqrt|cdot|sum|int|left|right|times|div|pm|mp|leq|geq|neq|approx|infty|partial|nabla|alpha|beta|gamma|delta|theta|lambda|mu|pi|sigma|phi|omega|forall|exists|in|notin|subset|supset|cup|cap|wedge|vee|neg|Rightarrow|Leftarrow|Leftrightarrow|rightarrow|leftarrow|uparrow|downarrow|overline|underline|hat|bar|vec|dot|ddot|tilde|mathbf|mathrm|mathit|text|begin|end|pmatrix|bmatrix|vmatrix)\b/.test(line);
            const hasSubSuperScript = /[a-zA-Z0-9]_\{|[a-zA-Z0-9]\^\{/.test(line);
            const hasUndelimitedLatex = /[a-zA-Z]\s*[=(]\s*\\[a-zA-Z]/.test(line) || /\\[a-zA-Z]+\{/.test(line);

            if (hasLatexCommands || hasSubSuperScript || hasUndelimitedLatex) {
                const trimmed = line.trim();
                return '$$' + trimmed + '$$';
            }
            return line;
        }).join('\n');

        result = result.replace(/\$\$([\s\S]*?)\$\$/g, function(match) {
            const placeholder = '\x00LATEXDISPLAY' + blocks.length + '\x00';
            blocks.push({ placeholder: placeholder, original: match, type: 'display' });
            return placeholder;
        });

        result = result.replace(/\$([^\$\n]+?)\$/g, function(match) {
            const placeholder = '\x00LATEXINLINE' + blocks.length + '\x00';
            blocks.push({ placeholder: placeholder, original: match, type: 'inline' });
            return placeholder;
        });

        return { text: result, blocks: blocks };
    }

    function reinjertLatexBlocks(html, blocks) {
        let result = html;
        blocks.forEach(function(block) {
            const escapedPlaceholder = block.placeholder
                .replace(/&amp;/g, '&')
                .replace(/&lt;/g, '<')
                .replace(/&gt;/g, '>');
            result = result.split(block.placeholder).join(block.original);
            result = result.split(escapedPlaceholder).join(block.original);
        });
        return result;
    }

    function preprocessLatex(text) {
        if (!text) return "";
        let result = text;
        result = result.replace(/\\\[([\s\S]*?)\\\]/g, function(match, inner) {
            return '$$' + inner + '$$';
        });
        result = result.replace(/\\\(([\s\S]*?)\\\)/g, function(match, inner) {
            return '$' + inner + '$';
        });
        result = result.split('\n').map(function(line) {
            if (/\$/.test(line)) return line;
            const hasLatexCommands = /\\(frac|sqrt|cdot|sum|int|left|right|times|div|pm|mp|leq|geq|neq|approx|infty|partial|nabla|alpha|beta|gamma|delta|theta|lambda|mu|pi|sigma|phi|omega|forall|exists|in|notin|subset|supset|cup|cap|wedge|vee|neg|Rightarrow|Leftarrow|Leftrightarrow|rightarrow|leftarrow|uparrow|downarrow|overline|underline|hat|bar|vec|dot|ddot|tilde|mathbf|mathrm|mathit|text|begin|end|pmatrix|bmatrix|vmatrix)\b/.test(line);
            const hasSubSuperScript = /[a-zA-Z0-9]_\{|[a-zA-Z0-9]\^\{/.test(line);
            const hasUndelimitedLatex = /[a-zA-Z]\s*[=(]\s*\\[a-zA-Z]/.test(line) || /\\[a-zA-Z]+\{/.test(line);
            if (hasLatexCommands || hasSubSuperScript || hasUndelimitedLatex) {
                const trimmed = line.trim();
                return '$$' + trimmed + '$$';
            }
            return line;
        }).join('\n');
        return result;
    }

    async function sendEditedUserMessage(newText, editedWrapperElement) {

        if (isGeneratingResponse) {
            return;
        }

        if (!newText || newText.trim() === '') {
            return;
        }

        if (editedWrapperElement) {
            let node = editedWrapperElement.nextSibling;
            while (node) {
                const next = node.nextSibling;
                node.parentNode.removeChild(node);
                node = next;
            }
            editedWrapperElement.parentNode.removeChild(editedWrapperElement);
        }

        const currentChat = chats.find(c => c.id === currentChatId);
        if (currentChat) {
            let cutIdx = -1;
            for (let i = currentChat.messages.length - 1; i >= 0; i--) {
                if (currentChat.messages[i].type === 'user') {
                    cutIdx = i;
                    break;
                }
            }
            if (cutIdx !== -1) {
                currentChat.messages = currentChat.messages.slice(0, cutIdx);
            }
        }

        let trimIdx = conversationHistory.length - 1;
        while (trimIdx > 0) {
            if (conversationHistory[trimIdx].role === 'user') {
                conversationHistory = conversationHistory.slice(0, trimIdx);
                break;
            }
            if (conversationHistory[trimIdx].role === 'assistant') {
                conversationHistory = conversationHistory.slice(0, trimIdx);
                trimIdx--;
            } else {
                break;
            }
        }

        abortController = new AbortController();

        saveGeneratingState();

        setGeneratingState(true);

        addMsg(newText, 'user', null);
        addMessageToCurrentChat('user', newText, null, false);

        if (newText) {
            lastUserText = newText;
        }

        toggleLoad(true);

        try {

            const userMessage = {
                role: "user",
                content: newText
            };

            conversationHistory.push(userMessage);

            optimizeConversationHistory();

            updateCurrentChatStorage();

            const modeConfig = MODE_CONFIGS[currentMode] || MODE_CONFIGS.normal;

            const requestMessages = buildRequestMessages();

            const requestBody = {
                model: "meta-llama/llama-4-scout-17b-16e-instruct",
                messages: requestMessages,
                temperature: modeConfig.temperature,
                max_tokens: modeConfig.max_tokens
            };

            const r = await sendRequestWithRetry(requestBody, abortController.signal);

            toggleLoad(false);

            const d = await r.json();

            if (d.choices && d.choices[0] && d.choices[0].message) {

                const aiResponse = cleanResponse(d.choices[0].message.content);

                conversationHistory.push({
                    role: "assistant",
                    content: aiResponse
                });

                optimizeConversationHistory();

                updateCurrentChatStorage();

                addMsg(aiResponse, 'ai');
                await addMessageToCurrentChat('ai', aiResponse, null, true);

            } else if (d.error) {

                if (d.error.code === "rate_limit_exceeded") {
                    addMsg("Motor saturado (Rate Limit). Por favor, espera un momento.", 'ai');
                } else {
                    addMsg("Error de la IA: " + d.error.message, 'ai');
                }

            } else {

                addMsg("Respuesta inesperada del servidor.", 'ai');

            }

        } catch (e) {

            toggleLoad(false);

            if (e.name === 'AbortError') {
                addMsg("Generacion detenida.", 'ai');
            } else {
                addMsg("Error de conexion al nucleo: " + e.message, 'ai');
            }

        } finally {

            toggleLoad(false);

            setGeneratingState(false);

            clearGeneratingState();

            input.style.height = "48px";
            input.scrollTop = 0;

            autoResizeTextarea();

        }

    }

    function cleanResponse(text) {

        if (!text) {
            return "";
        }

        let cleaned = text;

        cleaned = cleaned.replace(/(\$\$[^$]*\$\$)\s*\n\s*\.\s*\n/g, '$1\n\n');
        cleaned = cleaned.replace(/(\$\$[^$]*\$\$)\s*\n\s*\.\s*$/g, '$1');

        cleaned = cleaned.replace(/^[\s]*[•\-]\s*(\$\$)/gm, '$1');

        cleaned = cleaned.replace(/```math/g, "```math");
        cleaned = cleaned.replace(/```lua/g, "```lua");
        cleaned = cleaned.replace(/```luau/g, "```luau");
        cleaned = cleaned.replace(/```html/g, "```html");
        cleaned = cleaned.replace(/```css/g, "```css");
        cleaned = cleaned.replace(/```javascript/g, "```javascript");
        cleaned = cleaned.replace(/```js/g, "```js");
        cleaned = cleaned.replace(/```python/g, "```python");

        return cleaned;

    }

    function parseMarkdownTable(text) {

        const lines = text.split('\n');
        let result = '';
        let i = 0;

        while (i < lines.length) {
            const line = lines[i];

            if (line.trim().startsWith('|') && line.trim().endsWith('|')) {

                const nextLine = lines[i + 1] || '';
                const isHeaderSep = /^\|[\s\-\|:]+\|$/.test(nextLine.trim());

                if (isHeaderSep) {

                    result += '<table><thead><tr>';
                    const headers = line.trim().slice(1, -1).split('|').map(h => h.trim());
                    headers.forEach(function(h) {
                        result += '<th>' + h + '</th>';
                    });
                    result += '</tr></thead><tbody>';

                    i += 2;

                    while (i < lines.length && lines[i].trim().startsWith('|') && lines[i].trim().endsWith('|')) {
                        result += '<tr>';
                        const cells = lines[i].trim().slice(1, -1).split('|').map(c => c.trim());
                        cells.forEach(function(c) {
                            result += '<td>' + c + '</td>';
                        });
                        result += '</tr>';
                        i++;
                    }

                    result += '</tbody></table>';
                    continue;

                }

            }

            result += lines[i] + '\n';
            i++;

        }

        return result;

    }

    function parseMarkdown(text) {

        if (!text) {
            return "";
        }

        const { text: textWithPlaceholders, blocks: latexBlocks } = extractLatexBlocks(text);

        const htmlTableBlocks = [];
        let processed = textWithPlaceholders.replace(/<table[\s\S]*?<\/table>/gi, function(match) {
            htmlTableBlocks.push(match);
            return '___HTML_TABLE_' + (htmlTableBlocks.length - 1) + '___';
        });

        processed = parseMarkdownTable(processed);

        const markdownTableBlocks = [];
        processed = processed.replace(/<table[\s\S]*?<\/table>/gi, function(match) {
            markdownTableBlocks.push(match);
            return '___MD_TABLE_' + (markdownTableBlocks.length - 1) + '___';
        });

        processed = processed.replace(/(\x00LATEXDISPLAY\d+\x00)\s*\n\s*\.\s*(\n|$)/g, '$1\n$2');
        processed = processed.replace(/^[\s]*[•\-]\s*(\x00LATEXDISPLAY\d+\x00)\s*$/gm, '$1');

        let parsed = escapeHtml(processed);

        parsed = parsed.replace(/^#### (.*?)$/gm, '<h4>$1</h4>');
        parsed = parsed.replace(/^### (.*?)$/gm, '<h3>$1</h3>');
        parsed = parsed.replace(/^## (.*?)$/gm, '<h2>$1</h2>');
        parsed = parsed.replace(/^# (.*?)$/gm, '<h1>$1</h1>');

        parsed = parsed.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        parsed = parsed.replace(/__(.*?)__/g, '<strong>$1</strong>');

        parsed = parsed.replace(/\*(.*?)\*/g, '<em>$1</em>');
        parsed = parsed.replace(/_(.*?)_/g, '<em>$1</em>');

        parsed = parsed.replace(/^\s*[\*\-]\s+(.*?)$/gm, '<li>$1</li>');

        parsed = parsed.replace(/(<li>.*?<\/li>)/gs, '<ul>$1</ul>');

        parsed = parsed.replace(/<\/ul>\s*<ul>/g, '');

        parsed = parsed.replace(/\n/g, '<br>');

        parsed = reinjertLatexBlocks(parsed, latexBlocks);

        parsed = parsed.replace(/___HTML_TABLE_(\d+)___/g, function(match, idx) {
            return htmlTableBlocks[parseInt(idx)];
        });

        parsed = parsed.replace(/___MD_TABLE_(\d+)___/g, function(match, idx) {
            return markdownTableBlocks[parseInt(idx)];
        });

        parsed = parsed.replace(/(<br\s*\/?>)+(\x00LATEXDISPLAY|\$\$)/g, '$2');
        parsed = parsed.replace(/(\x00LATEXDISPLAY[^<]+)(<br\s*\/?>)+/g, '$1');

        return parsed;

    }

    function detectLanguage(codeText) {

        const firstLine = codeText.split('\n')[0].trim().toLowerCase();

        const languageList = [
            "html",
            "css",
            "javascript",
            "js",
            "python",
            "lua",
            "luau",
            "java",
            "cpp",
            "csharp",
            "php",
            "json",
            "pseudocode",
            "pseudo",
            "bash",
            "shell",
            "sh",
            "typescript",
            "ts",
            "sql",
            "xml",
            "yaml",
            "yml",
            "rust",
            "go",
            "swift",
            "kotlin",
            "ruby",
            "c",
            "text",
            "plaintext",
            "algorithmia",
            "algorithm",
            "algoritmo"
        ];

        if (languageList.includes(firstLine)) {
            return firstLine;
        }

        if (/^[a-z][a-z0-9_-]*$/.test(firstLine) && firstLine.length >= 2 && firstLine.length <= 25) {
            return firstLine;
        }

        return "código";

    }

    function removeLanguageLine(codeText, language) {

        const lines = codeText.split('\n');

        const firstLineLower = lines[0].trim().toLowerCase();

        if (language !== "código" && firstLineLower === language.toLowerCase()) {
            lines.shift();
        }

        return lines.join('\n');

    }

    function escapeHtml(text) {

        return text

            .replace(/</g, "&lt;")

    async function copy(btn) {

        const codeElement = btn.nextElementSibling;

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            btn.innerText = "Listo";

            setTimeout(() => {

                btn.innerText = "Copiar";

            }, 2000);

        } catch (error) {

            const tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            btn.innerText = "Listo";

            setTimeout(() => {

                btn.innerText = "Copiar";

            }, 2000);

        }

    }

    async function copyCodeBlock(btn) {

        var codeElement = wrapper ? wrapper.querySelector('pre code') : null;

        if (!codeElement) {
            return;

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            btn.textContent = 'Copiado';

            setTimeout(function() { btn.textContent = 'Copiar'; }, 2000);

        } catch (error) {

            var tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            btn.textContent = 'Copiado';

            setTimeout(function() { btn.textContent = 'Copiar'; }, 2000);

        }

    }

    async function copyCode(event, element) {

        event.preventDefault();

        const codeElement = element.querySelector("code");

        try {

            await navigator.clipboard.writeText(codeElement.innerText);

            const btn = element.parentElement.querySelector(".code-copy-btn");

            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = 'Copiado';
                setTimeout(function() { btn.textContent = originalText; }, 2000);
            }

        } catch (error) {

            const tempTextArea = document.createElement("textarea");

            tempTextArea.value = codeElement.innerText;

            document.body.appendChild(tempTextArea);

            tempTextArea.select();

            document.execCommand("copy");

            document.body.removeChild(tempTextArea);

            const btn = element.parentElement.querySelector(".code-copy-btn");

            if (btn) {
                const originalText = btn.textContent;
                btn.textContent = 'Copiado';
                setTimeout(function() { btn.textContent = originalText; }, 2000);
            }

        }

    }
